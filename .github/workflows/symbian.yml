          /* z3compat.h - Open C gaps and ARM alignment helpers. Included from psx.h by the patch script. */
          #ifndef Z3COMPAT_H
          #define Z3COMPAT_H
          #include <string.h>
          #include <ctype.h>
          #include <stddef.h>
          #include <stdint.h>

          static inline int z3_strncasecmp(const char *a, const char *b, size_t n)
          {
              for (; n; n--, a++, b++) {
                  int x = tolower((unsigned char)*a), y = tolower((unsigned char)*b);
                  if (x != y) return x - y;
                  if (!x) return 0;
              }
              return 0;
          }
          static inline int z3_strcasecmp(const char *a, const char *b)
          {
              for (;; a++, b++) {
                  int x = tolower((unsigned char)*a), y = tolower((unsigned char)*b);
                  if (x != y) return x - y;
                  if (!x) return 0;
              }
          }
          #define strcasecmp z3_strcasecmp
          #define strncasecmp z3_strncasecmp

          /* Emulated RAM is naturally aligned for compiled MIPS code: plain loads/stores on the fast path
           * (memcpy turns into byte accesses with -mno-unaligned-access), memcpy otherwise. */
          #define Z3_LD32(ptr, a) (__builtin_expect(!((a) & 3u), 1) ? *(const uint32_t *)(ptr) : ld32(ptr))
          #define Z3_LD16(ptr, a) (__builtin_expect(!((a) & 1u), 1) ? (uint32_t)*(const uint16_t *)(ptr) : ld16(ptr))
          #define Z3_ST32(ptr, a, v) do { if (__builtin_expect(!((a) & 3u), 1)) *(uint32_t *)(ptr) = (v); else st32((ptr), (v)); } while (0)
          #define Z3_ST16(ptr, a, v) do { if (__builtin_expect(!((a) & 1u), 1)) *(uint16_t *)(ptr) = (uint16_t)(v); else st16((ptr), (v)); } while (0)

          #endif
