          #!/usr/bin/env python3
          """Prepares the CrashBandicoot.Native sources for the Symbian^3 build (run from the repo root).

          * psx.h: pulls in compat/z3compat.h, aligned fast paths for RAM/scratch accessors (ARM, no unaligned access)
          * disc.c: no libgen.h, pread() -> locked lseek()+read()
          * libsdk.c: __sync_synchronize() -> compiler barrier (single core ARM11)
          * gpu_gles2.inc: Symbian GLES2 headers instead of the iOS ones
          * writes symbian/app/group/crashrecomp.mmp from crashrecomp.mmp.in + the source lists
          """
          import glob, os, re, shutil, sys

          N = "CrashBandicoot.Native"
          OPT = sys.argv[1] if len(sys.argv) > 1 else "-O2"

          def rd(p): return open(p, newline="").read()
          def wr(p, s): open(p, "w", newline="").write(s)

          # ---------------------------------------------------------------- GLES2 compat + diagnostics (EKA2L1 / Symbian)
          def apply_gles2_compat(s):
              if "GLES2-COMPAT" in s:
                  return s

              def rep(old, new, what):
                  nonlocal s
                  assert s.count(old) == 1, "gles2 compat anchor (%s): count=%d" % (what, s.count(old))
                  s = s.replace(old, new, 1)

              # ---- 1. vertex layout: float attributes only (no GL_SHORT). Texpage / CLUT / dither state is packed into two
              #         floats (a_pk) instead of two int16 vec4 -> 28 bytes per vertex ----------------------------------------
              rep("typedef struct { float x, y; uint8_t r, g, b, a; float u, v; int16_t tp[4]; int16_t cl[4]; } GVert;   /* 36 bytes */",
                  "typedef struct { float x, y; uint8_t r, g, b, a; float u, v; float tpw, clw; } GVert;   /* 28 bytes, GLES2-COMPAT: float attribs only */",
                  "GVert")
              rep("    glVertexAttribPointer(3, 4, GL_SHORT, GL_FALSE, sizeof(GVert), p->tp);\n"
                  "    glVertexAttribPointer(4, 4, GL_SHORT, GL_FALSE, sizeof(GVert), p->cl);\n",
                  "    glVertexAttribPointer(3, 2, GL_FLOAT, GL_FALSE, sizeof(GVert), &p->tpw);\n",
                  "attrib ptrs")
              rep("    glEnableVertexAttribArray(3); glEnableVertexAttribArray(4);\n}",
                  "    glEnableVertexAttribArray(3);\n}", "enable attribs")
              rep("        glDisableVertexAttribArray(3); glDisableVertexAttribArray(4);\n",
                  "        glDisableVertexAttribArray(3);\n", "present attribs")
              rep("    for (int i = 0; i < n; i++) {\n"
                  "        tv[i].tp[0] = (int16_t)(tex ? tp_x : 0); tv[i].tp[1] = (int16_t)(tex ? tp_y : 0);\n"
                  "        tv[i].tp[2] = (int16_t)depth;            tv[i].tp[3] = (int16_t)(raw ? 1 : 0);\n"
                  "        tv[i].cl[0] = (int16_t)clutx;            tv[i].cl[1] = (int16_t)cluty;\n"
                  "        tv[i].cl[2] = (int16_t)(dither ? 1 : 0); tv[i].cl[3] = 0;\n"
                  "    }\n",
                  "    /* texpage word: x/64 | y/256<<4 | depth<<5 | raw<<7 ; CLUT word: x/16 | y<<6 | dither<<15 (exact in a float) */\n"
                  "    const float tpw = (float)((tex ? ((tp_x >> 6) | ((tp_y >> 8) << 4)) : 0) | (depth << 5) | ((raw ? 1 : 0) << 7));\n"
                  "    const float clw = (float)(((clutx >> 4) & 63) | (cluty << 6) | ((dither ? 1 : 0) << 15));\n"
                  "    for (int i = 0; i < n; i++) { tv[i].tpw = tpw; tv[i].clw = clw; }\n",
                  "submit tp/cl")
              rep('static const char VS_MAIN[] =\n'
                  '    "attribute vec2 a_pos; attribute vec4 a_col; attribute vec2 a_uv;\\n"\n'
                  '    "attribute vec4 a_tp; attribute vec4 a_cl;\\n"\n'
                  '    "varying vec4 v_col; varying vec2 v_uv; varying vec4 v_tp; varying vec4 v_cl;\\n"\n'
                  '    "void main(){ v_col = a_col; v_uv = a_uv; v_tp = a_tp; v_cl = a_cl;\\n"',
                  'static const char VS_MAIN[] =\n'
                  '    "attribute vec2 a_pos; attribute vec4 a_col; attribute vec2 a_uv; attribute vec2 a_pk;\\n"\n'
                  '    "varying vec4 v_col; varying vec2 v_uv; varying vec2 v_pk;\\n"\n'
                  '    "void main(){ v_col = a_col; v_uv = a_uv; v_pk = a_pk;\\n"',
                  "VS_MAIN")

              # ---- 2. shaders: no #define/#ifdef, no multi-string glShaderSource, no loops, no dither texture -----------
              a = s.index("/* Main fragment shader. With TEXTURED defined")
              b = s.index("static const char FS_DISP[] =")
              new_fs = r'''/* Main fragment shader, assembled at start-up as ONE plain string per program (flat / textured): no
           * #define/#ifdef and no multi-string glShaderSource (emulated GLES2 layers can mangle both), no loops,
           * no dither texture (the 4x4 ordered-dither table is computed in the shader). GLES2-COMPAT.
           * Bit-exact tricks: every division is a multiplication by a power of two. */
          static const char FS_HEAD[] =
              "precision highp float;\n"
              "varying vec4 v_col; varying vec2 v_uv; varying vec2 v_pk;\n"
              "uniform sampler2D u_vram;\n"
              "uniform float u_setmask; uniform float u_chk;\n";

          static const char FS_TEX_DECL[] =
              "uniform float u_pass;\n"
              "uniform float u_twin; uniform vec2 u_twand; uniform vec2 u_twor;\n"
              "vec4 fetch(vec2 p){ p = mod(p, vec2(1024.0, 512.0));\n"
              "  return texture2D(u_vram, (p + 0.5) * vec2(0.0009765625, 0.001953125)); }\n"
              "vec4 bits(vec4 t){ return vec4(floor((t.rgb * 255.0 + 0.5) * 0.125), step(0.5, t.a)); }\n"
              "float word(vec4 b){ return b.r + b.g * 32.0 + b.b * 1024.0 + b.a * 32768.0; }\n"
              "float bit1(float a, float b, float p){ return mod(floor(a / p), 2.0) * mod(floor(b / p), 2.0) * p; }\n"
              "float band(float a, float b){\n"
              "  return bit1(a, b, 1.0) + bit1(a, b, 2.0) + bit1(a, b, 4.0) + bit1(a, b, 8.0)\n"
              "       + bit1(a, b, 16.0) + bit1(a, b, 32.0) + bit1(a, b, 64.0) + bit1(a, b, 128.0); }\n"
              "float twin(float x, float a, float o){ float t = band(x, a); return t + o - band(t, o); }\n";

          static const char FS_MAIN_A[] =
              "void main(){\n"
              "  float clw = floor(v_pk.y + 0.5);\n"
              "  float c1 = floor(clw * 0.015625);\n"
              "  float u_dither = mod(floor(c1 * 0.001953125), 2.0);\n";

          static const char FS_TEX_VARS[] =
              "  float tpw = floor(v_pk.x + 0.5);\n"
              "  float t1 = floor(tpw * 0.0625); float t2 = floor(t1 * 0.5);\n"
              "  vec2 u_tp = vec2(mod(tpw, 16.0) * 64.0, mod(t1, 2.0) * 256.0);\n"
              "  float u_depth = mod(t2, 4.0); float u_raw = floor(t2 * 0.25);\n"
              "  vec2 u_clut = vec2(mod(clw, 64.0) * 16.0, mod(c1, 512.0));\n";

          static const char FS_MAIN_B[] =
              "  float d = 0.0;\n"
              "  if (u_dither > 0.5) {\n"
              "    vec2 q = mod(floor(gl_FragCoord.xy), 4.0);\n"
              "    vec4 row = q.y < 0.5 ? vec4(0.0, 4.0, 1.0, 5.0) : (q.y < 1.5 ? vec4(6.0, 2.0, 7.0, 3.0)\n"
              "             : (q.y < 2.5 ? vec4(1.0, 5.0, 0.0, 4.0) : vec4(7.0, 3.0, 6.0, 2.0)));\n"
              "    d = (q.x < 0.5 ? row.x : (q.x < 1.5 ? row.y : (q.x < 2.5 ? row.z : row.w))) - 4.0;\n"
              "  }\n"
              "  if (u_chk > 0.5) {\n"
              "    if (texture2D(u_vram, gl_FragCoord.xy * vec2(0.0009765625, 0.001953125)).a > 0.5) discard;\n"
              "  }\n"
              "  vec3 c8 = floor(v_col.rgb * 255.0 + 0.5);\n"
              "  float alpha = u_setmask;\n"
              "  vec3 o;\n";

          static const char FS_TEX_BODY[] =
              "  vec2 uv = floor(v_uv + 0.004);\n"
              "  float u = mod(uv.x, 256.0); float v = mod(uv.y, 256.0);\n"
              "  if (u_twin > 0.5) { u = twin(u, u_twand.x, u_twor.x); v = twin(v, u_twand.y, u_twor.y); }\n"
              "  vec4 tk;\n"
              "  if (u_depth < 0.5) {\n"
              "    float wd = word(bits(fetch(vec2(u_tp.x + floor(u * 0.25), u_tp.y + v))));\n"
              "    float s = mod(u, 4.0);\n"
              "    float inv = s < 0.5 ? 1.0 : (s < 1.5 ? 0.0625 : (s < 2.5 ? 0.00390625 : 0.000244140625));\n"
              "    float idx = mod(floor(wd * inv), 16.0);\n"
              "    tk = bits(fetch(vec2(u_clut.x + idx, u_clut.y)));\n"
              "  } else if (u_depth < 1.5) {\n"
              "    float wd = word(bits(fetch(vec2(u_tp.x + floor(u * 0.5), u_tp.y + v))));\n"
              "    float inv = mod(u, 2.0) < 0.5 ? 1.0 : 0.00390625;\n"
              "    float idx = mod(floor(wd * inv), 256.0);\n"
              "    tk = bits(fetch(vec2(u_clut.x + idx, u_clut.y)));\n"
              "  } else {\n"
              "    tk = bits(fetch(vec2(u_tp.x + u, u_tp.y + v)));\n"
              "  }\n"
              "  if (tk.r + tk.g + tk.b + tk.a < 0.5) discard;\n"
              "  if (u_pass > 0.5 && u_pass < 1.5 && tk.a > 0.5) discard;\n"
              "  if (u_pass > 1.5 && tk.a < 0.5) discard;\n"
              "  alpha = max(alpha, tk.a);\n"
              "  vec3 m = tk.rgb * 8.0;\n"
              "  if (u_raw < 0.5) m = floor(m * c8 * 0.0078125);\n"
              "  o = min(floor(clamp(m + d, 0.0, 255.0) * 0.125), 31.0);\n";

          static const char FS_FLAT_BODY[] =
              "  o = min(floor(clamp(c8 + d, 0.0, 255.0) * 0.125), 31.0);\n";

          static const char FS_MAIN_END[] =
              "  gl_FragColor = vec4(o * (8.0 / 255.0), alpha);\n"
              "}\n";

          static char FS_FLAT_SRC[3072], FS_TEX_SRC[6144];

          static void build_fs_sources(void)
          {
              int a = snprintf(FS_FLAT_SRC, sizeof FS_FLAT_SRC, "%s%s%s%s%s",
                               FS_HEAD, FS_MAIN_A, FS_MAIN_B, FS_FLAT_BODY, FS_MAIN_END);
              int b = snprintf(FS_TEX_SRC, sizeof FS_TEX_SRC, "%s%s%s%s%s%s%s",
                               FS_HEAD, FS_TEX_DECL, FS_MAIN_A, FS_TEX_VARS, FS_MAIN_B, FS_TEX_BODY, FS_MAIN_END);
              if (a < 0 || a >= (int)sizeof FS_FLAT_SRC || b < 0 || b >= (int)sizeof FS_TEX_SRC)
                  plat_fatal("GLES2: fragment shader source buffer too small");
              plat_log("[GPU] fragment shader sources: flat %d bytes, textured %d bytes", a, b);
          }

          '''
              s = s[:a] + new_fs + s[b:]

              # compile_shader: single string, always log the info log (warnings included)
              a = s.index("static GLuint compile_shader(")
              b = s.index("static void make_tex(")
              new_cs = r'''static GLuint compile_shader(GLenum type, const char *src, const char *name)
          {
              plat_log("[GPU] compiling %s %s ...", name, type == GL_VERTEX_SHADER ? "VS" : "FS");
              GLuint s = glCreateShader(type);
              const char *one[1] = { src };
              glShaderSource(s, 1, one, NULL);
              glCompileShader(s);
              GLint ok = 0; glGetShaderiv(s, GL_COMPILE_STATUS, &ok);
              char log[1024]; log[0] = 0;
              glGetShaderInfoLog(s, sizeof log, NULL, log);
              if (!ok) {
                  plat_log("[GPU] shader error: %s %s: %s", name, type == GL_VERTEX_SHADER ? "VS" : "FS", log);
                  plat_fatal("GLES2 shader compile failed (see crash.log, line \"[GPU] shader error\")");
              }
              if (log[0]) plat_log("[GPU] shader note: %s %s: %s", name, type == GL_VERTEX_SHADER ? "VS" : "FS", log);
              return s;
          }

          static void build_prog(Prog *P, const char *vs, const char *fs, const char *name)
          {
              GLuint v = compile_shader(GL_VERTEX_SHADER, vs, name);
              GLuint f = compile_shader(GL_FRAGMENT_SHADER, fs, name);
              P->id = glCreateProgram();
              glAttachShader(P->id, v); glAttachShader(P->id, f);
              glBindAttribLocation(P->id, 0, "a_pos");
              glBindAttribLocation(P->id, 1, "a_col");
              glBindAttribLocation(P->id, 2, "a_uv");
              glBindAttribLocation(P->id, 3, "a_pk");
              glLinkProgram(P->id);
              GLint ok = 0; glGetProgramiv(P->id, GL_LINK_STATUS, &ok);
              if (!ok) {
                  char log[1024]; log[0] = 0;
                  glGetProgramInfoLog(P->id, sizeof log, NULL, log);
                  plat_log("[GPU] shader error: link %s: %s", name, log);
                  plat_fatal("GLES2 shader link failed (see crash.log, line \"[GPU] shader error\")");
              }
          #define U(n, s) P->n = glGetUniformLocation(P->id, s)
              U(vram, "u_vram"); U(setmask, "u_setmask"); U(chk, "u_chk"); U(pass, "u_pass");
              U(twin, "u_twin"); U(twand, "u_twand"); U(twor, "u_twor");
              U(rect, "u_rect"); U(rgb24, "u_rgb24"); U(off, "u_off");
          #undef U
              plat_log("[GPU] program %s: vram=%d setmask=%d chk=%d pass=%d twin=%d twand=%d twor=%d rect=%d rgb24=%d off=%d",
                       name, (int)P->vram, (int)P->setmask, (int)P->chk, (int)P->pass, (int)P->twin, (int)P->twand, (int)P->twor,
                       (int)P->rect, (int)P->rgb24, (int)P->off);
          }

          '''
              s = s[:a] + new_cs + s[b:]

              # Prog: the dither sampler is gone
              rep("    GLint vram, dith, setmask, chk, pass, twin, twand, twor, rect, rgb24, off;",
                  "    GLint vram, setmask, chk, pass, twin, twand, twor, rect, rgb24, off;", "Prog fields")
              rep("static GLuint tex_a, tex_b, tex_dith, fbo_a", "static GLuint tex_a, tex_b, fbo_a", "tex decl")

              # gl_init: drop the dither texture, build the shaders from the assembled strings
              a = s.index("    /* 4x4 ordered-dither table (+4 bias so it fits in unsigned bytes) */")
              b = s.index("    gl_invalidate();\n\n    glClearColor(0, 0, 0, 0);")
              new_init = r'''    plat_log("[GPU] init: building shaders");
              build_fs_sources();
              build_prog(&pf, VS_MAIN, FS_FLAT_SRC, "flat");
              build_prog(&pt, VS_MAIN, FS_TEX_SRC, "textured");
              build_prog(&pd, VS_DISP, FS_DISP, "display");
              build_prog(&pc, VS_MAIN, FS_COPY, "copy");
              glUseProgram(pf.id); glUniform1i(pf.vram, 0);      /* never change */
              glUseProgram(pt.id); glUniform1i(pt.vram, 0);
          '''
              s = s[:a] + new_init + s[b:]

              # draw_buf: only texture unit 0 is used now
              rep("        glActiveTexture(GL_TEXTURE1); glBindTexture(GL_TEXTURE_2D, tex_dith);\n"
                  "        glActiveTexture(GL_TEXTURE0); glBindTexture(GL_TEXTURE_2D, tex_b);\n",
                  "        glActiveTexture(GL_TEXTURE0); glBindTexture(GL_TEXTURE_2D, tex_b);\n", "draw_buf units")

              assert "tex_dith" not in s and 'sampler2D u_dith' not in s and '"#ifdef' not in s and '"#define' not in s

              # ---- 3. minimal logging only (no self test, no GL probes): first draw breadcrumbs + highp info -------------
              rep("    glDrawArrays(k->prim ? GL_LINES : GL_TRIANGLES, 0, cnt);\n",
                  "    if (!first_draw_logged) plat_log(\"[GPU] first glDrawArrays: cnt=%d tex=%d prim=%d prog=%u\", cnt, k->tex ? 1 : 0, (int)k->prim, (unsigned)P->id);\n"
                  "    glDrawArrays(k->prim ? GL_LINES : GL_TRIANGLES, 0, cnt);\n"
                  "    if (!first_draw_logged) plat_log(\"[GPU] first glDrawArrays returned\");\n", "draw breadcrumbs")
              rep("    plat_log(\"[GPU] GL_VERSION=%s\", (const char *)glGetString(GL_VERSION));\n}",
                  "    plat_log(\"[GPU] GL_VERSION=%s\", (const char *)glGetString(GL_VERSION));\n"
                  "    {\n"
                  "        GLint pr[2] = { 0, 0 }, pp = 0;\n"
                  "        glGetShaderPrecisionFormat(GL_FRAGMENT_SHADER, GL_HIGH_FLOAT, pr, &pp);\n"
                  "        plat_log(\"[GPU] fragment highp: range=2^%d precision=%d bits%s\", (int)pr[1], (int)pp, pp == 0 ? \"  <-- NO highp (texture decode will be wrong)\" : \"\");\n"
                  "    }\n}", "gl_init info")
              s += "\n/* GLES2-COMPAT applied */\n"
              return s

          # ---------------------------------------------------------------- psx.h
          p = N + "/src/psx.h"
          s = rd(p)
          if "z3compat.h" not in s:
              a = "#include <stdlib.h>\n"
              assert a in s, "psx.h anchor"
              s = s.replace(a, a + '#include "z3compat.h"\n', 1)
              s, n1 = re.subn(r"\bld32\((g_ram|g_scratch) \+ (\(p & \(PS_\w+ - 1\)\))\)", r"Z3_LD32(\1 + \2, p)", s)
              s, n2 = re.subn(r"\bld16\((g_ram|g_scratch) \+ (\(p & \(PS_\w+ - 1\)\))\)", r"Z3_LD16(\1 + \2, p)", s)
              s, n3 = re.subn(r"\bst32\((g_ram|g_scratch) \+ (\(p & \(PS_\w+ - 1\)\)), v\)", r"Z3_ST32(\1 + \2, p, v)", s)
              s, n4 = re.subn(r"\bst16\((g_ram|g_scratch) \+ (\(p & \(PS_\w+ - 1\)\)), v\)", r"Z3_ST16(\1 + \2, p, v)", s)
              assert (n1, n2, n3, n4) == (2, 2, 2, 2), (n1, n2, n3, n4)
              wr(p, s)

          # ---------------------------------------------------------------- disc.c
          p = N + "/src/disc.c"
          s = rd(p)
          if "z3_pread" not in s:
              s = s.replace("#include <libgen.h>\n", "#include <pthread.h>\n")
              old = "    ssize_t n = pread(t->fd, out, (size_t)want, (off_t)pos);"
              assert old in s, "disc.c pread"
              s = s.replace(old, "    ssize_t n = z3_pread(t->fd, out, (size_t)want, (off_t)pos);")
              anchor = "void disc_read_sector_data("
              helper = ("static pthread_mutex_t g_disc_mx = PTHREAD_MUTEX_INITIALIZER;\n"
                        "static ssize_t z3_pread(int fd, void *buf, size_t n, off_t pos)\n{\n"
                        "    ssize_t r = -1;\n    pthread_mutex_lock(&g_disc_mx);\n"
                        "    if (lseek(fd, pos, SEEK_SET) == pos) r = read(fd, buf, n);\n"
                        "    pthread_mutex_unlock(&g_disc_mx);\n    return r;\n}\n\n")
              assert anchor in s
              s = s.replace(anchor, helper + anchor, 1)
              wr(p, s)

          # ---------------------------------------------------------------- libsdk.c
          p = N + "/src/libsdk.c"
          s = rd(p)
          s = s.replace("__sync_synchronize();", '__asm__ volatile("" ::: "memory");')
          wr(p, s)

          # ---------------------------------------------------------------- GLES2 headers
          p = N + "/src/gpu_gles2.inc"
          s = rd(p)
          s = s.replace("#include <OpenGLES/ES2/gl.h>", "#include <GLES2/gl2.h>").replace("#include <OpenGLES/ES2/glext.h>", "#include <GLES2/gl2ext.h>")
          assert "OpenGLES/" not in s

          # glCopyTexSubImage2D (dispatch 0x112C = 4396) is missing in some EKA2L1 builds ("Can't find dispatch
          # function 4396") and some drivers; the VRAM snapshot sync (tex_a -> tex_b) is done with a second FBO and
          # the existing copy shader instead: only glFramebufferTexture2D + glDrawArrays, which the port already uses.
          if "fbo_b" not in s:
              a = "static GLuint tex_a, tex_b, tex_dith, fbo_a;"
              assert a in s, "gpu_gles2 fbo decl"
              s = s.replace(a, "static GLuint tex_a, tex_b, tex_dith, fbo_a, fbo_b;", 1)

              a = "    /* 4x4 ordered-dither table (+4 bias so it fits in unsigned bytes) */"
              assert a in s, "gpu_gles2 dither anchor"
              fbo_init = (
                  "    glGenFramebuffers(1, &fbo_b);\n"
                  "    glBindFramebuffer(GL_FRAMEBUFFER, fbo_b);\n"
                  "    glFramebufferTexture2D(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, tex_b, 0);\n"
                  "    fs = glCheckFramebufferStatus(GL_FRAMEBUFFER);\n"
                  "    if (fs != GL_FRAMEBUFFER_COMPLETE) {\n"
                  "        plat_log(\"[GPU] snapshot FBO incomplete: 0x%x\", (unsigned)fs);\n"
                  "        plat_fatal(\"GLES2: snapshot framebuffer is incomplete (see crash.log, line \\\"[GPU] snapshot FBO incomplete\\\")\");\n"
                  "    }\n"
                  "    glBindFramebuffer(GL_FRAMEBUFFER, fbo_a);\n\n")
              s = s.replace(a, fbo_init + a, 1)

              old = ("    glBindFramebuffer(GL_FRAMEBUFFER, fbo_a);\n"
                     "    glActiveTexture(GL_TEXTURE0);\n"
                     "    glBindTexture(GL_TEXTURE_2D, tex_b);\n"
                     "    glCopyTexSubImage2D(GL_TEXTURE_2D, 0, x0, y0, x0, y0, x1 - x0, y1 - y0);\n")
              assert old in s, "gpu_gles2 sync_snapshot body"
              new = ("    static const GVert sq[6] = {\n"
                     "        { 0, 0, 255, 255, 255, 255, 0, 0 }, { VRAM_W, 0, 255, 255, 255, 255, 0, 0 }, { 0, VRAM_H, 255, 255, 255, 255, 0, 0 },\n"
                     "        { VRAM_W, 0, 255, 255, 255, 255, 0, 0 }, { VRAM_W, VRAM_H, 255, 255, 255, 255, 0, 0 }, { 0, VRAM_H, 255, 255, 255, 255, 0, 0 },\n"
                     "    };\n"
                     "    glBindFramebuffer(GL_FRAMEBUFFER, fbo_b);          /* render tex_a -> tex_b (dirty rect only) */\n"
                     "    glViewport(0, 0, VRAM_W, VRAM_H);\n"
                     "    glEnable(GL_SCISSOR_TEST);\n"
                     "    glScissor(x0, y0, x1 - x0, y1 - y0);\n"
                     "    glDisable(GL_BLEND);\n"
                     "    glBindBuffer(GL_ARRAY_BUFFER, 0);\n"
                     "    glUseProgram(pc.id);\n"
                     "    glActiveTexture(GL_TEXTURE0);\n"
                     "    glBindTexture(GL_TEXTURE_2D, tex_a);\n"
                     "    glUniform1i(pc.vram, 0);\n"
                     "    glUniform1f(pc.setmask, 0.0f);\n"
                     "    glUniform1f(pc.chk, 0.0f);\n"
                     "    glUniform2f(pc.off, 0.0f, 0.0f);\n"
                     "    set_attribs(sq);\n"
                     "    glDrawArrays(GL_TRIANGLES, 0, 6);\n")
              s = s.replace(old, new, 1)
              assert "glCopyTexSubImage2D(GL_TEXTURE_2D" not in s
          s = apply_gles2_compat(s)
          wr(p, s)

          # ---------------------------------------------------------------- dispatch.c: stage breadcrumbs + first-frame log
          p = N + "/src/dispatch.c"
          s = rd(p)
          if "plat_cp" not in s:
              a = "#include <pthread.h>\n"
              assert a in s, "dispatch.c include anchor"
              s = s.replace(a, a + "extern void plat_cp(const char *stage);   /* Symbian crash breadcrumbs (psx_sym.c) */\n", 1)
              old = ("    plat_present(g_vram, x, y, w, h, rgb24, en);\n    frameclock_throttle();\n    libcd_tick();\n"
                     "    cd_advance_streaming();\n    bios_refresh_pad();\n    libpad_refresh();\n    irq_deliver(0, &g_cpu);\n}")
              assert s.count(old) == 1, "dispatch.c present anchor"
              new = ("    const bool dbg = g_present_calls <= 3;\n"
                     "    plat_cp(\"present: gpu_present\");\n"
                     "    plat_present(g_vram, x, y, w, h, rgb24, en);\n"
                     "    if (dbg) LOG(\"[FRAME] #%d presented\", (int)g_present_calls);\n"
                     "    plat_cp(\"present: frameclock_throttle\");\n"
                     "    frameclock_throttle();\n"
                     "    if (dbg) LOG(\"[FRAME] #%d throttle done\", (int)g_present_calls);\n"
                     "    plat_cp(\"present: libcd_tick\");\n"
                     "    libcd_tick();\n"
                     "    plat_cp(\"present: cd_advance_streaming\");\n"
                     "    cd_advance_streaming();\n"
                     "    plat_cp(\"present: pad\");\n"
                     "    bios_refresh_pad();\n    libpad_refresh();\n"
                     "    plat_cp(\"present: irq_deliver\");\n"
                     "    irq_deliver(0, &g_cpu);\n"
                     "    plat_cp(\"game code\");\n"
                     "    if (dbg) LOG(\"[FRAME] #%d irq delivered, back in game code\", (int)g_present_calls);\n}")
              s = s.replace(old, new, 1)
              old = "    cpu_restore(cpu, &snap);\n    if (irq >= 0 && irq < 8) g_irq_delivered[irq]++;"
              assert s.count(old) == 1, "dispatch.c irq anchor"
              s = s.replace(old, "    cpu_restore(cpu, &snap);\n    if (irq >= 0 && irq < 8 && g_irq_delivered[irq] == 0) LOG(\"[IRQ] first handler return irq=%d\", irq);\n    if (irq >= 0 && irq < 8) g_irq_delivered[irq]++;", 1)
              wr(p, s)

          # ---------------------------------------------------------------- libsdk.c: helper threads need a real stack
          p = N + "/src/libsdk.c"
          s = rd(p)
          if "z3_spawn" not in s:
              for a, b in (("pthread_create(&g_xa_thread, NULL, xa_loop, NULL);", "z3_spawn(&g_xa_thread, xa_loop, \"xa\");"),
                           ("pthread_create(&g_st_thread, NULL, st_loop, NULL);", "z3_spawn(&g_st_thread, st_loop, \"stream\");")):
                  assert s.count(a) == 1, "libsdk thread anchor " + a
                  s = s.replace(a, b, 1)
              for loop in ("xa", "st"):
                  a = "    (void)arg;\n    uint8_t sec[2352];\n    while (g_%s_run) {" % loop
                  assert s.count(a) == 1, "libsdk sec anchor " + loop
                  s = s.replace(a, "    (void)arg;\n    static uint8_t sec[2352];   /* off the (small) helper-thread stack */\n    while (g_%s_run) {" % loop, 1)
              a = "static void *xa_loop(void *arg)\n"
              assert s.count(a) == 1, "libsdk xa_loop anchor"
              helper = ("/* Symbian's default pthread stack is tiny; sector decode needs more. */\n"
                        "static void z3_spawn(pthread_t *t, void *(*fn)(void *), const char *name)\n{\n"
                        "    pthread_attr_t at;\n    pthread_attr_init(&at);\n    pthread_attr_setstacksize(&at, 256 * 1024);\n"
                        "    int r = pthread_create(t, &at, fn, NULL);\n"
                        "    plat_log(\"[THREAD] %s thread rc=%d (stack 256 KB)\", name, r);\n}\n\n")
              s = s.replace(a, helper + a, 1)
              wr(p, s)

          # ---------------------------------------------------------------- mmp
          EXCLUDE = {"host_stub.c"}
          def lst(d):
              return sorted(os.path.basename(f) for f in glob.glob(N + "/" + d + "/*.c"))
          src, gen = lst("src"), lst("gen")
          assert gen, "no generated C files in %s/gen (recompile step failed?)" % N
          names = src + gen + ["psx_sym.c"]
          dup = sorted(set(x for x in names if names.count(x) > 1))
          assert not dup, "duplicate object names: %s" % dup

          lines = ["SOURCEPATH      ../../../%s/src" % N] + ["SOURCE          " + f for f in src] + [""]
          lines += ["SOURCEPATH      ../../../%s/gen" % N] + ["SOURCE          " + f for f in gen] + [""]
          tmpl = open("symbian/app/group/crashrecomp.mmp.in").read()
          out = tmpl.replace("@CORE_SOURCES@", "\n".join(lines)).replace("@OPT@", OPT)
          open("symbian/app/group/crashrecomp.mmp", "w").write(out)
          print("mmp: %d runtime + %d generated C files, opt=%s" % (len(src), len(gen), OPT))
          CR_EOF
          python3 symbian/tools/patch_symbian.py "$OPT"

      - uses: actions/upload-artifact@v4
        with:
          name: port-src
          retention-days: 1
          path: |
            CrashBandicoot.Native/src
            CrashBandicoot.Native/gen
            symbian

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-recomp
          path: build-recomp.log
          if-no-files-found: ignore

  host-check:
    name: Core build check (host)
    needs: sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: .
      - name: Install GLES2 headers and libs
        run: sudo apt-get update && sudo apt-get install -y libgles-dev
      - name: Compile and link the runtime without Symbian
        run: |
          set -e
          mkdir obj
          FL="-std=gnu11 -O0 -fno-strict-aliasing -fwrapv -w -DNDEBUG -DPSX_GLES2 -Isymbian/core -Isymbian/compat -ICrashBandicoot.Native/src -ICrashBandicoot.Native/gen"
          ls CrashBandicoot.Native/src/*.c CrashBandicoot.Native/gen/*.c symbian/core/psx_sym.c symbian/tools/host_check.c \
            | xargs -P 4 -I{} sh -c 'gcc '"$FL"' -c {} -o obj/$(basename {} .c).o'
          gcc obj/*.o -o host_check -lm -lpthread -lGLESv2
          mkdir empty && ./host_check "$PWD/empty"

  build-sis:
    name: Build crashrecomp.sisx
    needs: sources
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: .
      - name: Check out symbian3-toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_REPO }}
          ref: ${{ env.TOOLCHAIN_REF }}
          path: toolchain
      - name: Create case-sensitive APFS volume
        run: |
          hdiutil create -size 24g -fs "Case-sensitive APFS" -volname Symbian -type SPARSE "$RUNNER_TEMP/symbian"
          hdiutil attach "$RUNNER_TEMP/symbian.sparseimage" -mountpoint "$SYMBIAN_VOL"
          sudo chown "$(id -u):$(id -g)" "$SYMBIAN_VOL"
      - name: Install Homebrew dependencies and Rosetta
        run: |
          brew install perl openssl@3 unshield make gmp mpfr libmpc isl gnu-sed
          brew unlink perl
          sudo softwareupdate --install-rosetta --agree-to-license || true
      - name: Restore toolchain cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: symbian3-toolchain-${{ env.TOOLCHAIN_REF }}-${{ env.GNUPOC_COMMIT }}-${{ env.GCC4SYMBIAN_COMMIT }}
      - name: Build toolchain and install SDK (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: 4
        run: |
          set -eo pipefail
          cd toolchain
          source Scripts/env.sh
          mkdir -p "$N8_SRC"
          git clone https://github.com/mstorsjo/gnupoc-package "$N8_SRC/gnupoc-package"
          git -C "$N8_SRC/gnupoc-package" checkout "$GNUPOC_COMMIT"
          git clone https://github.com/fedor4ever/GCC4Symbian "$N8_SRC/GCC4Symbian"
          git -C "$N8_SRC/GCC4Symbian" checkout "$GCC4SYMBIAN_COMMIT"
          Scripts/fetch-sdk.sh
          Scripts/build-host-tools.sh
          Scripts/build-gcc.sh
          Scripts/install-sdk.sh
      - name: Save toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Check Open C (libc, pthread) in the SDK
        run: |
          source toolchain/Scripts/env.sh
          ls "${EPOCROOT}epoc32/include/stdapis/stdio.h" "${EPOCROOT}epoc32/include/stdapis/pthread.h" "${EPOCROOT}epoc32/include/GLES2/gl2.h" "${EPOCROOT}epoc32/include/EGL/egl.h" || true
          ls "${EPOCROOT}epoc32/release/armv5/lib/" | grep -i -E "^lib(c|m|pthread|EGL|GLESv2)\." || true
          arm-none-symbianelf-gcc -print-file-name=include
      - name: Build crashrecomp
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          GCCINC="$(arm-none-symbianelf-gcc -print-file-name=include)"
          cd symbian/app/group
          sed -i.bak "s|@GCCINC@|$GCCINC|" crashrecomp.mmp
          bldmake bldfiles
          if ! abld build -keepgoing gcce urel; then
            echo "::warning::build failed, retrying without multi-touch (Z3_MULTITOUCH)"
            sed -i.bak2 "/Z3_MULTITOUCH/d" crashrecomp.mmp
            abld reallyclean gcce urel || true
            bldmake bldfiles
            abld build gcce urel
          fi
          test -f "${EPOCROOT}epoc32/release/gcce/urel/crashrecomp.exe"
          ls -l "${EPOCROOT}epoc32/release/gcce/urel/crashrecomp.exe"
      - name: Package signed SIS
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"
          "$N8_REPO/Scripts/package-sis.sh" symbian/app/sis/crashrecomp.pkg "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: crashrecomp-symbian3
          path: dist/crashrecomp.sisx
          if-no-files-found: error
