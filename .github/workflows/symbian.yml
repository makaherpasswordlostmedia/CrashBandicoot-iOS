          wr(p, s)

          # ---------------------------------------------------------------- GLES2 headers
          p = N + "/src/gpu_gles2.inc"
          s = rd(p)
          s = s.replace("#include <OpenGLES/ES2/gl.h>", "#include <GLES2/gl2.h>").replace("#include <OpenGLES/ES2/glext.h>", "#include <GLES2/gl2ext.h>")
          assert "OpenGLES/" not in s

          # glCopyTexSubImage2D (dispatch 0x112C = 4396) is missing in some EKA2L1 builds ("Can't find dispatch
          # function 4396") and some drivers; the VRAM snapshot sync (tex_a -> tex_b) is done with a second FBO and
          # the existing copy shader instead: only glFramebufferTexture2D + glDrawArrays, which the port already uses.
          if "fbo_b" not in s:
              a = "static GLuint tex_a, tex_b, tex_dith, fbo_a;"
              assert a in s, "gpu_gles2 fbo decl"
              s = s.replace(a, "static GLuint tex_a, tex_b, tex_dith, fbo_a, fbo_b;", 1)

              a = "    /* 4x4 ordered-dither table (+4 bias so it fits in unsigned bytes) */"
              assert a in s, "gpu_gles2 dither anchor"
              fbo_init = (
                  "    glGenFramebuffers(1, &fbo_b);\n"
                  "    glBindFramebuffer(GL_FRAMEBUFFER, fbo_b);\n"
                  "    glFramebufferTexture2D(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, tex_b, 0);\n"
                  "    fs = glCheckFramebufferStatus(GL_FRAMEBUFFER);\n"
                  "    if (fs != GL_FRAMEBUFFER_COMPLETE) {\n"
                  "        plat_log(\"[GPU] snapshot FBO incomplete: 0x%x\", (unsigned)fs);\n"
                  "        plat_fatal(\"GLES2: snapshot framebuffer is incomplete (see crash.log, line \\\"[GPU] snapshot FBO incomplete\\\")\");\n"
                  "    }\n"
                  "    glBindFramebuffer(GL_FRAMEBUFFER, fbo_a);\n\n")
              s = s.replace(a, fbo_init + a, 1)

              old = ("    glBindFramebuffer(GL_FRAMEBUFFER, fbo_a);\n"
                     "    glActiveTexture(GL_TEXTURE0);\n"
                     "    glBindTexture(GL_TEXTURE_2D, tex_b);\n"
                     "    glCopyTexSubImage2D(GL_TEXTURE_2D, 0, x0, y0, x0, y0, x1 - x0, y1 - y0);\n")
              assert old in s, "gpu_gles2 sync_snapshot body"
              new = ("    static const GVert sq[6] = {\n"
                     "        { 0, 0, 255, 255, 255, 255, 0, 0 }, { VRAM_W, 0, 255, 255, 255, 255, 0, 0 }, { 0, VRAM_H, 255, 255, 255, 255, 0, 0 },\n"
                     "        { VRAM_W, 0, 255, 255, 255, 255, 0, 0 }, { VRAM_W, VRAM_H, 255, 255, 255, 255, 0, 0 }, { 0, VRAM_H, 255, 255, 255, 255, 0, 0 },\n"
                     "    };\n"
                     "    glBindFramebuffer(GL_FRAMEBUFFER, fbo_b);          /* render tex_a -> tex_b (dirty rect only) */\n"
                     "    glViewport(0, 0, VRAM_W, VRAM_H);\n"
                     "    glEnable(GL_SCISSOR_TEST);\n"
                     "    glScissor(x0, y0, x1 - x0, y1 - y0);\n"
                     "    glDisable(GL_BLEND);\n"
                     "    glBindBuffer(GL_ARRAY_BUFFER, 0);\n"
                     "    glUseProgram(pc.id);\n"
                     "    glActiveTexture(GL_TEXTURE0);\n"
                     "    glBindTexture(GL_TEXTURE_2D, tex_a);\n"
                     "    glUniform1i(pc.vram, 0);\n"
                     "    glUniform1f(pc.setmask, 0.0f);\n"
                     "    glUniform1f(pc.chk, 0.0f);\n"
                     "    glUniform2f(pc.off, 0.0f, 0.0f);\n"
                     "    set_attribs(sq);\n"
                     "    glDrawArrays(GL_TRIANGLES, 0, 6);\n")
              s = s.replace(old, new, 1)
              assert "glCopyTexSubImage2D(GL_TEXTURE_2D" not in s
          s = apply_gles2_compat(s)
          s = apply_ui_present(s)
          s = apply_bucket_grid(s)
          s = apply_tex_diag(s)
          s = apply_perf_tex(s)
          s = apply_diag2(s)
          s = apply_single_ctx(s)
          wr(p, s)

          # ---------------------------------------------------------------- dispatch.c: stage breadcrumbs + first-frame log
          p = N + "/src/dispatch.c"
          s = rd(p)
          if "plat_cp" not in s:
              a = "#include <pthread.h>\n"
              assert a in s, "dispatch.c include anchor"
              s = s.replace(a, a + "extern void plat_cp(const char *stage);   /* Symbian crash breadcrumbs (psx_sym.c) */\n", 1)
              a2 = "volatile uint32_t g_last_call_addr;\n"
              assert s.count(a2) == 1, "dispatch.c g_last_call_addr anchor"
              s = s.replace(a2, a2 + "volatile uint32_t g_call_ring[16];   /* last 16 dispatched function addresses (crash diagnostics) */\n", 1)
              a3 = "    g_last_call_addr = addr;\n"
              assert s.count(a3) == 1, "dispatch.c call anchor"
              s = s.replace(a3, a3 + "    g_call_ring[g_call_count & 15u] = addr;\n", 1)
              s += ("\nvoid dispatch_dump_ring(void)\n{\n    char buf[16 * 9 + 4]; int n = 0;\n    const uint32_t i0 = (uint32_t)(g_call_count & 15u);\n"
                    "    for (uint32_t k = 0; k < 16; k++) n += snprintf(buf + n, sizeof buf - (size_t)n, \"%08X \", (unsigned)g_call_ring[(i0 + k) & 15u]);\n"
                    "    LOG(\"[CALLS] last 16 dispatched functions (oldest -> newest): %s| total calls=%u\", buf, (unsigned)g_call_count);\n}\n")
              old = ("    plat_present(g_vram, x, y, w, h, rgb24, en);\n    frameclock_throttle();\n    libcd_tick();\n"
                     "    cd_advance_streaming();\n    bios_refresh_pad();\n    libpad_refresh();\n    irq_deliver(0, &g_cpu);\n}")
              assert s.count(old) == 1, "dispatch.c present anchor"
              new = ("    const bool dbg = g_present_calls <= 3;\n"
                     "    plat_cp(\"present: gpu_present\");\n"
                     "    plat_present(g_vram, x, y, w, h, rgb24, en);\n"
                     "    if (dbg) LOG(\"[FRAME] #%d presented\", (int)g_present_calls);\n"
                     "    plat_cp(\"present: frameclock_throttle\");\n"
                     "    frameclock_throttle();\n"
                     "    if (dbg) LOG(\"[FRAME] #%d throttle done\", (int)g_present_calls);\n"
                     "    plat_cp(\"present: libcd_tick\");\n"
                     "    libcd_tick();\n"
                     "    plat_cp(\"present: cd_advance_streaming\");\n"
                     "    cd_advance_streaming();\n"
                     "    plat_cp(\"present: pad\");\n"
                     "    bios_refresh_pad();\n    libpad_refresh();\n"
                     "    plat_cp(\"present: irq_deliver\");\n"
                     "    irq_deliver(0, &g_cpu);\n"
                     "    plat_cp(\"game code\");\n"
                     "    if (dbg) LOG(\"[FRAME] #%d irq delivered, back in game code\", (int)g_present_calls);\n}")
              s = s.replace(old, new, 1)
              old = "    cpu_restore(cpu, &snap);\n    if (irq >= 0 && irq < 8) g_irq_delivered[irq]++;"
              assert s.count(old) == 1, "dispatch.c irq anchor"
              s = s.replace(old, "    cpu_restore(cpu, &snap);\n    if (irq >= 0 && irq < 8 && g_irq_delivered[irq] == 0) LOG(\"[IRQ] first handler return irq=%d\", irq);\n    if (irq >= 0 && irq < 8) g_irq_delivered[irq]++;", 1)
              wr(p, s)

          # ---------------------------------------------------------------- libsdk.c: helper threads need a real stack
          p = N + "/src/libsdk.c"
          s = rd(p)
          if "z3_spawn" not in s:
              for a, b in (("pthread_create(&g_xa_thread, NULL, xa_loop, NULL);", "z3_spawn(&g_xa_thread, xa_loop, \"xa\");"),
                           ("pthread_create(&g_st_thread, NULL, st_loop, NULL);", "z3_spawn(&g_st_thread, st_loop, \"stream\");")):
                  assert s.count(a) == 1, "libsdk thread anchor " + a
                  s = s.replace(a, b, 1)
              for loop in ("xa", "st"):
                  a = "    (void)arg;\n    uint8_t sec[2352];\n    while (g_%s_run) {" % loop
                  assert s.count(a) == 1, "libsdk sec anchor " + loop
                  s = s.replace(a, "    (void)arg;\n    static uint8_t sec[2352];   /* off the (small) helper-thread stack */\n    while (g_%s_run) {" % loop, 1)
              a = "static void *xa_loop(void *arg)\n"
              assert s.count(a) == 1, "libsdk xa_loop anchor"
              helper = ("/* Symbian's default pthread stack is tiny; sector decode needs more. */\n"
                        "static void z3_spawn(pthread_t *t, void *(*fn)(void *), const char *name)\n{\n"
                        "    pthread_attr_t at;\n    pthread_attr_init(&at);\n    pthread_attr_setstacksize(&at, 256 * 1024);\n"
                        "    int r = pthread_create(t, &at, fn, NULL);\n"
                        "    plat_log(\"[THREAD] %s thread rc=%d (stack 256 KB)\", name, r);\n}\n\n")
              s = s.replace(a, helper + a, 1)
              wr(p, s)

          # ---------------------------------------------------------------- mmp
          EXCLUDE = {"host_stub.c"}
          def lst(d):
              return sorted(os.path.basename(f) for f in glob.glob(N + "/" + d + "/*.c"))
          src, gen = lst("src"), lst("gen")
          assert gen, "no generated C files in %s/gen (recompile step failed?)" % N
          names = src + gen + ["psx_sym.c"]
          dup = sorted(set(x for x in names if names.count(x) > 1))
          assert not dup, "duplicate object names: %s" % dup

          lines = ["SOURCEPATH      ../../../%s/src" % N] + ["SOURCE          " + f for f in src] + [""]
          lines += ["SOURCEPATH      ../../../%s/gen" % N] + ["SOURCE          " + f for f in gen] + [""]
          tmpl = open("symbian/app/group/crashrecomp.mmp.in").read()
          out = tmpl.replace("@CORE_SOURCES@", "\n".join(lines)).replace("@OPT@", OPT)
          open("symbian/app/group/crashrecomp.mmp", "w").write(out)
          print("mmp: %d runtime + %d generated C files, opt=%s" % (len(src), len(gen), OPT))
          CR_EOF
          python3 symbian/tools/patch_symbian.py "$OPT"

      - uses: actions/upload-artifact@v4
        with:
          name: port-src
          retention-days: 1
          path: |
            CrashBandicoot.Native/src
            CrashBandicoot.Native/gen
            symbian

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-recomp
          path: build-recomp.log
          if-no-files-found: ignore

  host-check:
    name: Core build check (host)
    needs: sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: .
      - name: Install GLES2 headers and libs
        run: sudo apt-get update && sudo apt-get install -y libgles-dev
      - name: Compile and link the runtime without Symbian
        run: |
          set -e
          mkdir obj
          FL="-std=gnu11 -O0 -fno-strict-aliasing -fwrapv -w -DNDEBUG -DPSX_GLES2 -Isymbian/core -Isymbian/compat -ICrashBandicoot.Native/src -ICrashBandicoot.Native/gen"
          ls CrashBandicoot.Native/src/*.c CrashBandicoot.Native/gen/*.c symbian/core/psx_sym.c symbian/tools/host_check.c \
            | xargs -P 4 -I{} sh -c 'gcc '"$FL"' -c {} -o obj/$(basename {} .c).o'
          gcc obj/*.o -o host_check -lm -lpthread -lGLESv2
          mkdir empty && ./host_check "$PWD/empty"

  build-sis:
    name: Build crashrecomp.sisx
    needs: sources
    runs-on: ${{ inputs.runner || vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: .
      - name: Check out symbian3-toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_REPO }}
          ref: ${{ env.TOOLCHAIN_REF }}
          path: toolchain
      - name: Create case-sensitive APFS volume
        run: |
          hdiutil create -size 24g -fs "Case-sensitive APFS" -volname Symbian -type SPARSE "$RUNNER_TEMP/symbian"
          hdiutil attach "$RUNNER_TEMP/symbian.sparseimage" -mountpoint "$SYMBIAN_VOL"
          sudo chown "$(id -u):$(id -g)" "$SYMBIAN_VOL"
      - name: Install Homebrew dependencies and Rosetta
        run: |
          brew install perl openssl@3 unshield make gmp mpfr libmpc isl gnu-sed
          brew unlink perl
          sudo softwareupdate --install-rosetta --agree-to-license || true
      - name: Restore toolchain cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: symbian3-toolchain-${{ env.TOOLCHAIN_REF }}-${{ env.GNUPOC_COMMIT }}-${{ env.GCC4SYMBIAN_COMMIT }}
      - name: Build toolchain and install SDK (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: 4
        run: |
          set -eo pipefail
          cd toolchain
          source Scripts/env.sh
          mkdir -p "$N8_SRC"
          git clone https://github.com/mstorsjo/gnupoc-package "$N8_SRC/gnupoc-package"
          git -C "$N8_SRC/gnupoc-package" checkout "$GNUPOC_COMMIT"
          git clone https://github.com/fedor4ever/GCC4Symbian "$N8_SRC/GCC4Symbian"
          git -C "$N8_SRC/GCC4Symbian" checkout "$GCC4SYMBIAN_COMMIT"
          Scripts/fetch-sdk.sh
          Scripts/build-host-tools.sh
          Scripts/build-gcc.sh
          Scripts/install-sdk.sh
      - name: Save toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Check Open C (libc, pthread) in the SDK
        run: |
          source toolchain/Scripts/env.sh
          ls "${EPOCROOT}epoc32/include/stdapis/stdio.h" "${EPOCROOT}epoc32/include/stdapis/pthread.h" "${EPOCROOT}epoc32/include/GLES2/gl2.h" "${EPOCROOT}epoc32/include/EGL/egl.h" || true
          ls "${EPOCROOT}epoc32/release/armv5/lib/" | grep -i -E "^lib(c|m|pthread|EGL|GLESv2)\." || true
          arm-none-symbianelf-gcc -print-file-name=include
      - name: Build crashrecomp
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          GCCINC="$(arm-none-symbianelf-gcc -print-file-name=include)"
          cd symbian/app/group
          sed -i.bak "s|@GCCINC@|$GCCINC|" crashrecomp.mmp
          bldmake bldfiles
          if ! abld build -keepgoing gcce urel; then
            echo "::warning::build failed, retrying without multi-touch (Z3_MULTITOUCH)"
            sed -i.bak2 "/Z3_MULTITOUCH/d" crashrecomp.mmp
            abld reallyclean gcce urel || true
            bldmake bldfiles
            abld build gcce urel
          fi
          test -f "${EPOCROOT}epoc32/release/gcce/urel/crashrecomp.exe"
          ls -l "${EPOCROOT}epoc32/release/gcce/urel/crashrecomp.exe"
      - name: Package signed SIS
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"
          "$N8_REPO/Scripts/package-sis.sh" symbian/app/sis/crashrecomp.pkg "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: crashrecomp-symbian3
          path: dist/crashrecomp.sisx
          if-no-files-found: error
