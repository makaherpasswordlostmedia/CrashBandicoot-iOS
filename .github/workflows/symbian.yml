          /* z3compat.h - Open C gaps and ARM alignment helpers. Included from psx.h by the patch script. */
          #ifndef Z3COMPAT_H
          #define Z3COMPAT_H
          #include <string.h>
          #include <ctype.h>
          #include <stddef.h>
          #include <stdint.h>

          static inline int z3_strncasecmp(const char *a, const char *b, size_t n)
          {
              for (; n; n--, a++, b++) {
                  int x = tolower((unsigned char)*a), y = tolower((unsigned char)*b);
                  if (x != y) return x - y;
                  if (!x) return 0;
              }
              return 0;
          }
          static inline int z3_strcasecmp(const char *a, const char *b)
          {
              for (;; a++, b++) {
                  int x = tolower((unsigned char)*a), y = tolower((unsigned char)*b);
                  if (x != y) return x - y;
                  if (!x) return 0;
              }
          }
          #define strcasecmp z3_strcasecmp
          #define strncasecmp z3_strncasecmp

          /* Emulated RAM is naturally aligned for compiled MIPS code: plain loads/stores on the fast path
           * (memcpy turns into byte accesses with -mno-unaligned-access), memcpy otherwise. */
          #define Z3_LD32(ptr, a) (__builtin_expect(!((a) & 3u), 1) ? *(const uint32_t *)(ptr) : ld32(ptr))
          #define Z3_LD16(ptr, a) (__builtin_expect(!((a) & 1u), 1) ? (uint32_t)*(const uint16_t *)(ptr) : ld16(ptr))
          #define Z3_ST32(ptr, a, v) do { if (__builtin_expect(!((a) & 3u), 1)) *(uint32_t *)(ptr) = (v); else st32((ptr), (v)); } while (0)
          #define Z3_ST16(ptr, a, v) do { if (__builtin_expect(!((a) & 1u), 1)) *(uint16_t *)(ptr) = (uint16_t)(v); else st16((ptr), (v)); } while (0)

          #endif
          CR_EOF
          mkdir -p symbian/core
          cat > symbian/core/psx_sym.c <<'CR_EOF'
          /* psx_sym.c - Symbian^3 platform layer (replaces ios_host.m; EGL part in crash_gl.cpp).
           * The emulation runs on a pthread. The Avkon UI thread polls finished frames, mixes audio
           * (spu_mix) and feeds the pad bits. Rendering is the GLES2 backend (PowerVR SGX on N8/C7/E7). */
          #include <pthread.h>
          #include <unistd.h>
          #include <dirent.h>
          #include <stdarg.h>
          #include <sys/stat.h>
          #include <sys/time.h>
          #include "psx.h"
          #include "psx_sym.h"

          static char g_base[300], g_cue[420], g_saves[420], g_logpath[420];
          static FILE *g_logf;
          static pthread_mutex_t g_log_mx = PTHREAD_MUTEX_INITIALIZER;
          static char g_err[220];
          static volatile int g_has_err;
          static volatile int g_sound = 1, g_started;

          void plat_log(const char *fmt, ...)
          {
              pthread_mutex_lock(&g_log_mx);
              if (!g_logf && g_logpath[0]) g_logf = fopen(g_logpath, "w");
              if (g_logf) {
                  va_list a; va_start(a, fmt);
                  vfprintf(g_logf, fmt, a);
                  va_end(a);
                  fputc('\n', g_logf);
                  fflush(g_logf);
              }
              pthread_mutex_unlock(&g_log_mx);
          }

          uint64_t plat_time_ns(void)
          {
              struct timeval tv;
              gettimeofday(&tv, NULL);
              return (uint64_t)tv.tv_sec * 1000000000ull + (uint64_t)tv.tv_usec * 1000ull;
          }

          void plat_sleep_us(unsigned us) { PSym_SleepUs(us); }
          const char *plat_disc_path(void) { return g_cue; }
          const char *plat_save_dir(void) { return g_saves; }
          void plat_input_poll(void) {}
          void plat_rumble(uint8_t large, uint8_t small_) { (void)large; (void)small_; }

          void plat_fatal(const char *msg)
          {
              plat_log("[FATAL] %s", msg);
              snprintf(g_err, sizeof g_err, "%s", msg);
              g_has_err = 1;
              g_paused = 1;
              for (;;) PSym_SleepUs(500000);
          }

          /* The GLES2 backend keeps VRAM on the GPU: draw the display rectangle and swap. */
          void gpu_present(int dx, int dy, int dw, int dh, bool rgb24, bool enabled);

          void plat_present(const uint16_t *vram, int dx, int dy, int dw, int dh, bool rgb24, bool enabled)
          {
              (void)vram;
              while (g_paused && !g_has_err) PSym_SleepUs(10000);
              gpu_present(dx, dy, dw, dh, rgb24, enabled);
              PSym_GlSwap();
          }

          void PSym_SetPad(unsigned mask) { g_pad_pressed = mask; }
          void PSym_SetPaused(int paused) { g_paused = paused; }
          void PSym_SetSound(int on) { g_sound = on; }
          const char *PSym_Error(void) { return g_has_err ? g_err : NULL; }

          void PSym_Flush(void)
          {
              if (g_card_a) card_flush(g_card_a);
              if (g_card_b) card_flush(g_card_b);
          }

          void PSym_MixAudio(short *dst, int frames)
          {
              if (!g_started || g_has_err) { memset(dst, 0, (size_t)frames * 4); return; }
              spu_mix((int16_t *)dst, frames);      /* always mixed: keeps voices and the XA ring moving */
              if (!g_sound) memset(dst, 0, (size_t)frames * 4);
          }

          static int find_cue(const char *dir, char *out, size_t outsz)
          {
              DIR *d = opendir(dir);
              if (!d) return 0;
              struct dirent *e;
              int ok = 0;
              while ((e = readdir(d))) {
                  size_t n = strlen(e->d_name);
                  if (n > 4 && strcasecmp(e->d_name + n - 4, ".cue") == 0) {
                      if (out) snprintf(out, outsz, "%s/%s", dir, e->d_name);
                      ok = 1;
                      break;
                  }
              }
              closedir(d);
              return ok;
          }

          int PSym_Probe(const char *dir) { return find_cue(dir, NULL, 0); }

          static void *emu_main(void *arg)
          {
              (void)arg;
              runtime_run_game();
              plat_fatal("game returned");
              return NULL;
          }

          static int fail(const char *msg)
          {
              snprintf(g_err, sizeof g_err, "%s", msg);
              g_has_err = 1;
              return -1;
          }

          int PSym_Start(const char *basedir)
          {
              if (g_started) return 0;
              snprintf(g_base, sizeof g_base, "%s", basedir);
              snprintf(g_saves, sizeof g_saves, "%s/saves", g_base);
              snprintf(g_logpath, sizeof g_logpath, "%s/crash.log", g_base);
              mkdir(g_saves, 0755);

              if (!find_cue(g_base, g_cue, sizeof g_cue)) return fail("No .cue file in the crashbandicoot folder.");

              plat_log("---- launch, cue=%s", g_cue);
              pthread_attr_t at;
              pthread_attr_init(&at);
              pthread_attr_setstacksize(&at, 1024 * 1024);
              pthread_t th;
              if (pthread_create(&th, &at, emu_main, NULL) != 0) return fail("Cannot start the emulation thread.");
              pthread_detach(th);
              g_started = 1;
              return 0;
          }
          CR_EOF
          mkdir -p symbian/core
          cat > symbian/core/psx_sym.h <<'CR_EOF'
          /* psx_sym.h - C interface between the native RecompOne runtime and the Symbian front end. */
          #ifndef PSX_SYM_H
          #define PSX_SYM_H

          #ifdef __cplusplus
          extern "C" {
          #endif

          /* Pad bits (active-high), identical to PAD_* in psx.h. */
          enum {
            PSYM_PAD_SELECT = 1 << 0, PSYM_PAD_START = 1 << 3,
            PSYM_PAD_UP = 1 << 4, PSYM_PAD_RIGHT = 1 << 5, PSYM_PAD_DOWN = 1 << 6, PSYM_PAD_LEFT = 1 << 7,
            PSYM_PAD_L2 = 1 << 8, PSYM_PAD_R2 = 1 << 9, PSYM_PAD_L1 = 1 << 10, PSYM_PAD_R1 = 1 << 11,
            PSYM_PAD_TRIANGLE = 1 << 12, PSYM_PAD_CIRCLE = 1 << 13, PSYM_PAD_CROSS = 1 << 14, PSYM_PAD_SQUARE = 1 << 15
          };

          enum { PSYM_AUDIO_RATE = 44100, PSYM_AUDIO_FRAMES = 1024 };

          /* 1 if dir (e.g. "E:/crashbandicoot") exists and holds a .cue file. */
          int  PSym_Probe(const char *dir);
          /* Boots the game on its own thread. 0 = started, otherwise PSym_Error() says why. */
          int  PSym_Start(const char *basedir);
          /* NULL while everything is fine, else the last fatal message. */
          const char *PSym_Error(void);

          void PSym_SetPad(unsigned mask);
          void PSym_SetPaused(int paused);
          void PSym_SetSound(int on);
          void PSym_Flush(void);                      /* write memory cards */

          /* EGL/GLES2 host (C++, crash_gl.cpp). PSym_GlInit runs on the UI thread with the RWindow* of the GL view
           * and returns NULL on success or an error text. The context is made current on the emulation thread. */
          const char *PSym_GlInit(void *rwindow);
          int  PSym_GlSwap(void);

          /* 44.1 kHz stereo PCM16: frames * 2 samples. */
          void PSym_MixAudio(short *dst, int frames);

          /* Implemented in C++ (RTimer): microsecond sleep. */
          void PSym_SleepUs(unsigned us);

          #ifdef __cplusplus
          }
          #endif
          #endif
          CR_EOF
          mkdir -p symbian/tools
          cat > symbian/tools/host_check.c <<'CR_EOF'
          /* Link/start check on a desktop: the runtime (GLES2 backend) must link without Symbian and
           * fail cleanly without a disc. The EGL host (crash_gl.cpp) is Symbian only, so it is stubbed here. */
          #include "psx_sym.h"
          #include <stdio.h>
          #include <unistd.h>

          void PSym_SleepUs(unsigned us) { usleep(us); }
          void plat_gl_make_current(void) {}
          void plat_gl_screen(int *fbo, int *w, int *h) { *fbo = 0; *w = 640; *h = 360; }
          int PSym_GlSwap(void) { return 1; }
          const char *PSym_GlInit(void *w) { (void)w; return 0; }

          int main(int argc, char **argv)
          {
              int r = PSym_Start(argc > 1 ? argv[1] : ".");
              const char *e = PSym_Error();
              printf("start=%d err=%s\n", r, e ? e : "none");
              return 0;
          }
          CR_EOF
          mkdir -p symbian/tools
          cat > symbian/tools/patch_symbian.py <<'CR_EOF'
          #!/usr/bin/env python3
          """Prepares the CrashBandicoot.Native sources for the Symbian^3 build (run from the repo root).

          * psx.h: pulls in compat/z3compat.h, aligned fast paths for RAM/scratch accessors (ARM, no unaligned access)
          * disc.c: no libgen.h, pread() -> locked lseek()+read()
          * libsdk.c: __sync_synchronize() -> compiler barrier (single core ARM11)
          * gpu_gles2.inc: Symbian GLES2 headers instead of the iOS ones
          * writes symbian/app/group/crashrecomp.mmp from crashrecomp.mmp.in + the source lists
          """
          import glob, os, re, shutil, sys

          N = "CrashBandicoot.Native"
          OPT = sys.argv[1] if len(sys.argv) > 1 else "-O2"

          def rd(p): return open(p, newline="").read()
          def wr(p, s): open(p, "w", newline="").write(s)

          # ---------------------------------------------------------------- psx.h
          p = N + "/src/psx.h"
          s = rd(p)
          if "z3compat.h" not in s:
              a = "#include <stdlib.h>\n"
              assert a in s, "psx.h anchor"
              s = s.replace(a, a + '#include "z3compat.h"\n', 1)
              s, n1 = re.subn(r"\bld32\((g_ram|g_scratch) \+ (\(p & \(PS_\w+ - 1\)\))\)", r"Z3_LD32(\1 + \2, p)", s)
              s, n2 = re.subn(r"\bld16\((g_ram|g_scratch) \+ (\(p & \(PS_\w+ - 1\)\))\)", r"Z3_LD16(\1 + \2, p)", s)
              s, n3 = re.subn(r"\bst32\((g_ram|g_scratch) \+ (\(p & \(PS_\w+ - 1\)\)), v\)", r"Z3_ST32(\1 + \2, p, v)", s)
              s, n4 = re.subn(r"\bst16\((g_ram|g_scratch) \+ (\(p & \(PS_\w+ - 1\)\)), v\)", r"Z3_ST16(\1 + \2, p, v)", s)
              assert (n1, n2, n3, n4) == (2, 2, 2, 2), (n1, n2, n3, n4)
              wr(p, s)

          # ---------------------------------------------------------------- disc.c
          p = N + "/src/disc.c"
          s = rd(p)
          if "z3_pread" not in s:
              s = s.replace("#include <libgen.h>\n", "#include <pthread.h>\n")
              old = "    ssize_t n = pread(t->fd, out, (size_t)want, (off_t)pos);"
              assert old in s, "disc.c pread"
              s = s.replace(old, "    ssize_t n = z3_pread(t->fd, out, (size_t)want, (off_t)pos);")
              anchor = "void disc_read_sector_data("
              helper = ("static pthread_mutex_t g_disc_mx = PTHREAD_MUTEX_INITIALIZER;\n"
                        "static ssize_t z3_pread(int fd, void *buf, size_t n, off_t pos)\n{\n"
                        "    ssize_t r = -1;\n    pthread_mutex_lock(&g_disc_mx);\n"
                        "    if (lseek(fd, pos, SEEK_SET) == pos) r = read(fd, buf, n);\n"
                        "    pthread_mutex_unlock(&g_disc_mx);\n    return r;\n}\n\n")
              assert anchor in s
              s = s.replace(anchor, helper + anchor, 1)
              wr(p, s)

          # ---------------------------------------------------------------- libsdk.c
          p = N + "/src/libsdk.c"
          s = rd(p)
          s = s.replace("__sync_synchronize();", '__asm__ volatile("" ::: "memory");')
          wr(p, s)

          # ---------------------------------------------------------------- GLES2 headers
          p = N + "/src/gpu_gles2.inc"
          s = rd(p)
          s = s.replace("#include <OpenGLES/ES2/gl.h>", "#include <GLES2/gl2.h>").replace("#include <OpenGLES/ES2/glext.h>", "#include <GLES2/gl2ext.h>")
          assert "OpenGLES/" not in s
          wr(p, s)

          # ---------------------------------------------------------------- mmp
          EXCLUDE = {"host_stub.c"}
          def lst(d):
              return sorted(os.path.basename(f) for f in glob.glob(N + "/" + d + "/*.c"))
          src, gen = lst("src"), lst("gen")
          assert gen, "no generated C files in %s/gen (recompile step failed?)" % N
          names = src + gen + ["psx_sym.c"]
          dup = sorted(set(x for x in names if names.count(x) > 1))
          assert not dup, "duplicate object names: %s" % dup

          lines = ["SOURCEPATH      ../../../%s/src" % N] + ["SOURCE          " + f for f in src] + [""]
          lines += ["SOURCEPATH      ../../../%s/gen" % N] + ["SOURCE          " + f for f in gen] + [""]
          tmpl = open("symbian/app/group/crashrecomp.mmp.in").read()
          out = tmpl.replace("@CORE_SOURCES@", "\n".join(lines)).replace("@OPT@", OPT)
          open("symbian/app/group/crashrecomp.mmp", "w").write(out)
          print("mmp: %d runtime + %d generated C files, opt=%s" % (len(src), len(gen), OPT))
          CR_EOF
          python3 symbian/tools/patch_symbian.py "$OPT"

      - uses: actions/upload-artifact@v4
        with:
          name: port-src
          retention-days: 1
          path: |
            CrashBandicoot.Native/src
            CrashBandicoot.Native/gen
            symbian

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-recomp
          path: build-recomp.log
          if-no-files-found: ignore

  host-check:
    name: Core build check (host)
    needs: sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: .
      - name: Install GLES2 headers and libs
        run: sudo apt-get update && sudo apt-get install -y libgles-dev
      - name: Compile and link the runtime without Symbian
        run: |
          set -e
          mkdir obj
          FL="-std=gnu11 -O0 -fno-strict-aliasing -fwrapv -w -DNDEBUG -DPSX_GLES2 -Isymbian/core -Isymbian/compat -ICrashBandicoot.Native/src -ICrashBandicoot.Native/gen"
          ls CrashBandicoot.Native/src/*.c CrashBandicoot.Native/gen/*.c symbian/core/psx_sym.c symbian/tools/host_check.c \
            | xargs -P 4 -I{} sh -c 'gcc '"$FL"' -c {} -o obj/$(basename {} .c).o'
          gcc obj/*.o -o host_check -lm -lpthread -lGLESv2
          mkdir empty && ./host_check "$PWD/empty"

  build-sis:
    name: Build crashrecomp.sisx
    needs: sources
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: port-src
          path: .
      - name: Check out symbian3-toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_REPO }}
          ref: ${{ env.TOOLCHAIN_REF }}
          path: toolchain
      - name: Create case-sensitive APFS volume
        run: |
          hdiutil create -size 24g -fs "Case-sensitive APFS" -volname Symbian -type SPARSE "$RUNNER_TEMP/symbian"
          hdiutil attach "$RUNNER_TEMP/symbian.sparseimage" -mountpoint "$SYMBIAN_VOL"
          sudo chown "$(id -u):$(id -g)" "$SYMBIAN_VOL"
      - name: Install Homebrew dependencies and Rosetta
        run: |
          brew install perl openssl@3 unshield make gmp mpfr libmpc isl gnu-sed
          brew unlink perl
          sudo softwareupdate --install-rosetta --agree-to-license || true
      - name: Restore toolchain cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: symbian3-toolchain-${{ env.TOOLCHAIN_REF }}-${{ env.GNUPOC_COMMIT }}-${{ env.GCC4SYMBIAN_COMMIT }}
      - name: Build toolchain and install SDK (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: 4
        run: |
          set -eo pipefail
          cd toolchain
          source Scripts/env.sh
          mkdir -p "$N8_SRC"
          git clone https://github.com/mstorsjo/gnupoc-package "$N8_SRC/gnupoc-package"
          git -C "$N8_SRC/gnupoc-package" checkout "$GNUPOC_COMMIT"
          git clone https://github.com/fedor4ever/GCC4Symbian "$N8_SRC/GCC4Symbian"
          git -C "$N8_SRC/GCC4Symbian" checkout "$GCC4SYMBIAN_COMMIT"
          Scripts/fetch-sdk.sh
          Scripts/build-host-tools.sh
          Scripts/build-gcc.sh
          Scripts/install-sdk.sh
      - name: Save toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Check Open C (libc, pthread) in the SDK
        run: |
          source toolchain/Scripts/env.sh
          ls "${EPOCROOT}epoc32/include/stdapis/stdio.h" "${EPOCROOT}epoc32/include/stdapis/pthread.h" "${EPOCROOT}epoc32/include/GLES2/gl2.h" "${EPOCROOT}epoc32/include/EGL/egl.h" || true
          ls "${EPOCROOT}epoc32/release/armv5/lib/" | grep -i -E "^lib(c|m|pthread|EGL|GLESv2)\." || true
          arm-none-symbianelf-gcc -print-file-name=include
      - name: Build crashrecomp
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          GCCINC="$(arm-none-symbianelf-gcc -print-file-name=include)"
          cd symbian/app/group
          sed -i.bak "s|@GCCINC@|$GCCINC|" crashrecomp.mmp
          bldmake bldfiles
          if ! abld build -keepgoing gcce urel; then
            echo "::warning::build failed, retrying without multi-touch (Z3_MULTITOUCH)"
            sed -i.bak2 "/Z3_MULTITOUCH/d" crashrecomp.mmp
            abld reallyclean gcce urel || true
            bldmake bldfiles
            abld build gcce urel
          fi
          test -f "${EPOCROOT}epoc32/release/gcce/urel/crashrecomp.exe"
          ls -l "${EPOCROOT}epoc32/release/gcce/urel/crashrecomp.exe"
      - name: Package signed SIS
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"
          "$N8_REPO/Scripts/package-sis.sh" symbian/app/sis/crashrecomp.pkg "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: crashrecomp-symbian3
          path: dist/crashrecomp.sisx
          if-no-files-found: error
