          mkdir -p symbian/core
          cat > symbian/core/psx_sym.c <<'CR_EOF'
          /* psx_sym.c - Symbian^3 platform layer (replaces ios_host.m; EGL part in crash_gl.cpp).
           * The emulation runs on a pthread. The Avkon UI thread polls finished frames, mixes audio
           * (spu_mix) and feeds the pad bits. Rendering is the GLES2 backend (PowerVR SGX on N8/C7/E7). */
          #include <pthread.h>
          #include <unistd.h>
          #include <dirent.h>
          #include <stdarg.h>
          #include <sys/stat.h>
          #include <sys/time.h>
          #include "psx.h"
          #include "psx_sym.h"

          static char g_base[300], g_cue[420], g_saves[420], g_logpath[420];
          static FILE *g_logf;
          static uint64_t g_log_t0;
          static pthread_mutex_t g_log_mx = PTHREAD_MUTEX_INITIALIZER;
          static char g_err[220];
          static volatile int g_has_err;
          static volatile int g_sound = 1, g_started;

          void plat_log(const char *fmt, ...)
          {
              pthread_mutex_lock(&g_log_mx);
              if (!g_logf && g_logpath[0]) { g_logf = fopen(g_logpath, "w"); g_log_t0 = plat_time_ns(); }
              if (g_logf) {
                  fprintf(g_logf, "[%6u] ", (unsigned)((plat_time_ns() - g_log_t0) / 1000000ull));   /* ms since launch */
                  va_list a; va_start(a, fmt);
                  vfprintf(g_logf, fmt, a);
                  va_end(a);
                  fputc('\n', g_logf);
                  fflush(g_logf);
              }
              pthread_mutex_unlock(&g_log_mx);
          }

          uint64_t plat_time_ns(void)
          {
              struct timeval tv;
              gettimeofday(&tv, NULL);
              return (uint64_t)tv.tv_sec * 1000000000ull + (uint64_t)tv.tv_usec * 1000ull;
          }

          /* ---- crash breadcrumbs + watchdog -------------------------------------------------------------------------
           * plat_cp() records the last stage the emulation thread entered. A watchdog thread logs every 2 s whether the
           * game is still moving (frames / last called function); when it is not, the log says "STALL" and where. */
          static const char *volatile g_cp = "boot";
          void plat_cp(const char *s) { g_cp = s; }
          const char *plat_get_cp(void) { return g_cp; }
          unsigned plat_last_call(void) { return (unsigned)g_last_call_addr; }

          static const char *volatile g_ui_cp = "ui: idle";
          static volatile unsigned g_ui_ticks;
          void plat_ui_cp(const char *s) { g_ui_cp = s; }
          void dispatch_dump_ring(void);
          void gpu_log_stats(void);
          void disc_log_stats(void);

          /* Everything we know about where the game / renderer / UI are right now (watchdog stall + CPU exception). */
          void plat_dump_state(void)
          {
              plat_log("[STATE] emu cp=%s | ui cp=%s ui_ticks=%u | last_call=0x%08X frames=%d paused=%d", g_cp, g_ui_cp, g_ui_ticks,
                       (unsigned)g_last_call_addr, (int)g_present_calls, (int)g_paused);
              dispatch_dump_ring();
              gpu_log_stats();
              disc_log_stats();
          }

          static void *wd_main(void *arg)
          {
              (void)arg;
              int64_t last_frames = -1; unsigned last_call = 0xFFFFFFFFu, tick = 0, still = 0, last_ui = 0xFFFFFFFFu, ui_still = 0;
              const uint64_t t0 = plat_time_ns();
              for (;;) {
                  PSym_SleepUs(2000000);
                  tick++;
                  const int64_t fr = g_present_calls;
                  const unsigned lc = (unsigned)g_last_call_addr, ut = g_ui_ticks, secs = (unsigned)((plat_time_ns() - t0) / 1000000000ull);
                  still = (fr != last_frames || lc != last_call) ? 0 : still + 1;
                  ui_still = (ut != last_ui) ? 0 : ui_still + 1;
                  last_frames = fr; last_call = lc; last_ui = ut;
                  if (still >= 1) {
                      if (still <= 5 || (still % 15) == 0)
                          plat_log("[WD] t=%us EMU STALL x%u: frames=%d last_call=0x%08X cp=%s paused=%d err=%d", secs, still, (int)fr, lc, g_cp, (int)g_paused, (int)g_has_err);
                      if (still == 1 || still == 6) plat_dump_state();
                  } else if (tick <= 15 || (tick % 30) == 0) {
                      plat_log("[WD] t=%us ok: frames=%d last_call=0x%08X cp=%s ui_ticks=%u", secs, (int)fr, lc, g_cp, ut);
                  }
                  if (ui_still >= 3 && (ui_still == 3 || (ui_still % 15) == 0))
                      plat_log("[WD] t=%us UI thread: no ticks for %us, ui cp=%s (normal only in the menu / background)", secs, ui_still * 2, g_ui_cp);
                  if (tick == 1 || tick == 5 || (tick % 30) == 0) PSym_LogHeap("watchdog");
              }
              return NULL;
          }

          void plat_sleep_us(unsigned us)
          {
              static int n;
              if (n < 2) plat_log("[SLEEP] first plat_sleep_us(%u) ...", us);
              PSym_SleepUs(us);
              if (n < 2) plat_log("[SLEEP] returned");
              n++;
          }
          const char *plat_disc_path(void) { return g_cue; }
          const char *plat_save_dir(void) { return g_saves; }
          void plat_input_poll(void) {}
          void plat_rumble(uint8_t large, uint8_t small_) { (void)large; (void)small_; }

          void plat_fatal(const char *msg)
          {
              plat_log("[FATAL] %s", msg);
              snprintf(g_err, sizeof g_err, "%s", msg);
              g_has_err = 1;
              g_paused = 1;
              for (;;) PSym_SleepUs(500000);
          }

          /* The GLES2 backend keeps VRAM on the GPU: draw the display rectangle and swap. */
          void gpu_present(int dx, int dy, int dw, int dh, bool rgb24, bool enabled);
          int  gpu_ui_present(void);          /* UI thread: draw the last published frame into the window, 1 = something to swap */

          void plat_present(const uint16_t *vram, int dx, int dy, int dw, int dh, bool rgb24, bool enabled)
          {
              static int n;
              (void)vram;
              while (g_paused && !g_has_err) PSym_SleepUs(10000);
              gpu_present(dx, dy, dw, dh, rgb24, enabled);      /* emulation thread: only publishes the frame (no EGL window calls) */
              if (n < 3) plat_log("[PRESENT] frame #%d published to the UI thread", n + 1);
              n++;
          }

          /* UI thread (called from the container's tick): draw the newest published frame and swap. */
          void PSym_UiPresent(void)
          {
              static int n, first;
              if (!g_started || g_has_err) return;
              if (PSym_GlSingle()) return;           /* single-context mode: the emulation thread presents */
              g_ui_ticks++;
              if (!first) { first = 1; plat_log("[UI] first tick"); PSym_LogHeap("ui first tick"); }
              plat_ui_cp("ui: gpu_ui_present");
              if (!gpu_ui_present()) { plat_ui_cp("ui: idle"); return; }
              if (n < 3) plat_log("[UI] swap #%d ...", n + 1);
              plat_ui_cp("ui: eglSwapBuffers");
              const uint64_t ts = plat_time_ns();
              int ok = PSym_GlSwap();
              const uint64_t dts = plat_time_ns() - ts;
              plat_ui_cp("ui: idle");
              {
                  static int slow;
                  if (dts > 100000000ull && slow++ < 40) plat_log("[SLOW] eglSwapBuffers took %u ms (ui_ticks=%u)", (unsigned)(dts / 1000000ull), g_ui_ticks);
              }
              if (n < 3) plat_log("[UI] swap #%d returned %d", n + 1, ok);
              n++;
          }

          void PSym_SetPad(unsigned mask) { g_pad_pressed = mask; }
          void PSym_SetPaused(int paused) { g_paused = paused; }
          void PSym_SetSound(int on) { g_sound = on; }
          const char *PSym_Error(void) { return g_has_err ? g_err : NULL; }

          void PSym_Flush(void)
          {
              if (g_card_a) card_flush(g_card_a);
              if (g_card_b) card_flush(g_card_b);
          }

          void PSym_MixAudio(short *dst, int frames)
          {
              if (!g_started || g_has_err) { memset(dst, 0, (size_t)frames * 4); return; }
              spu_mix((int16_t *)dst, frames);      /* always mixed: keeps voices and the XA ring moving */
              if (!g_sound) memset(dst, 0, (size_t)frames * 4);
          }

          static int find_cue(const char *dir, char *out, size_t outsz)
          {
              DIR *d = opendir(dir);
              if (!d) return 0;
              struct dirent *e;
              int ok = 0;
              while ((e = readdir(d))) {
                  size_t n = strlen(e->d_name);
                  if (n > 4 && strcasecmp(e->d_name + n - 4, ".cue") == 0) {
                      if (out) snprintf(out, outsz, "%s/%s", dir, e->d_name);
                      ok = 1;
                      break;
                  }
              }
              closedir(d);
              return ok;
          }

          int PSym_Probe(const char *dir) { return find_cue(dir, NULL, 0); }

          static void *emu_main(void *arg)
          {
              (void)arg;
              plat_log("[THREAD] emulation thread started");
              PSym_LogHeap("emulation thread");
              PSym_InstallExcHandler();
              plat_cp("runtime_run_game");
              runtime_run_game();
              plat_log("[THREAD] runtime_run_game returned (cp=%s)", g_cp);
              plat_fatal("game returned");
              return NULL;
          }

          static int fail(const char *msg)
          {
              snprintf(g_err, sizeof g_err, "%s", msg);
              g_has_err = 1;
              return -1;
          }

          void plat_dump_path(char *out, unsigned n, const char *name) { snprintf(out, n, "%s/%s", g_base, name); }

          int PSym_Start(const char *basedir)
          {
              if (g_started) return 0;
              snprintf(g_base, sizeof g_base, "%s", basedir);
              snprintf(g_saves, sizeof g_saves, "%s/saves", g_base);
              snprintf(g_logpath, sizeof g_logpath, "%s/crash.log", g_base);
              {   /* keep the previous run (the one that crashed) as crash_prev.log */
                  char prev[420];
                  snprintf(prev, sizeof prev, "%s/crash_prev.log", g_base);
                  remove(prev);
                  rename(g_logpath, prev);
              }
              mkdir(g_saves, 0755);

              if (!find_cue(g_base, g_cue, sizeof g_cue)) return fail("No .cue file in the crashbandicoot folder.");

              plat_log("---- launch, cue=%s", g_cue);
              PSym_LogHeap("ui thread at launch");
              pthread_attr_t at;
              pthread_attr_init(&at);
              pthread_attr_setstacksize(&at, 1024 * 1024);
              pthread_t th;
              if (pthread_create(&th, &at, emu_main, NULL) != 0) return fail("Cannot start the emulation thread.");
              pthread_detach(th);
              plat_log("[THREAD] emulation thread created (stack 1 MB)");
              {
                  pthread_attr_t wa; pthread_t wt;
                  pthread_attr_init(&wa);
                  pthread_attr_setstacksize(&wa, 64 * 1024);
                  int wr = pthread_create(&wt, &wa, wd_main, NULL);
                  if (wr == 0) pthread_detach(wt);
                  plat_log("[THREAD] watchdog rc=%d", wr);
              }
              g_started = 1;
              return 0;
          }
