          // Microsecond sleep for the emulation thread (User::After is limited to the 15 ms tick).
          #include <e32std.h>
          #include "psx_sym.h"

          extern "C" void PSym_SleepUs(unsigned us)
              {
              RTimer t;
              if (t.CreateLocal() != KErrNone)
                  {
                  User::After(us < 1000 ? 1000 : (TInt)us);
                  return;
                  }
              TRequestStatus s;
              t.HighRes(s, TTimeIntervalMicroSeconds32((TInt)us));
              User::WaitForRequest(s);
              t.Close();
              }

          extern "C" void plat_log(const char *fmt, ...);

          // Last-chance logger for CPU exceptions (data abort, undefined instruction, FPU, ...) on the emulation thread.
          static void CrashExcHandler(TExcType aType)
              {
              plat_log("[EXC] exception type=%d cp=%s last_call=0x%08x", (int)aType, plat_get_cp(), plat_last_call());
              plat_dump_state();
              User::Panic(_L("CrashExc"), (TInt)aType);
              }

          extern "C" void PSym_LogHeap(const char *aTag)
              {
              RHeap& h = User::Heap();
              TInt biggest = 0;
              TInt avail = h.Available(biggest);
              plat_log("[HEAP] %s: size=%d max=%d free=%d biggest_free=%d", aTag, (int)h.Size(), (int)h.MaxLength(), (int)avail, (int)biggest);
              }

          extern "C" void PSym_InstallExcHandler(void)
              {
              TInt r = User::SetExceptionHandler(CrashExcHandler, KExceptionFault | KExceptionInteger | KExceptionFpe);
              plat_log("[SYS] exception handler installed, r=%d", (int)r);
              }
