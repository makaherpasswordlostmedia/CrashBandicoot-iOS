name: Build Crash Bandicoot for Symbian^3 (SIS, GLES2)

# SELF-CONTAINED: this single file carries the whole Symbian port (symbian/ tree) and patches the
# CrashBandicoot.Native sources at build time. Rendering: OpenGL ES 2.0 over EGL (PowerVR SGX: N8, C7, E7...). Put it at .github/workflows/symbian.yml of the repo.
#
# Run: Actions -> "Build Crash Bandicoot for Symbian^3 (SIS)" -> Run workflow.
# Disc IDs (your own dump, Google Drive "anyone with the link"): fill the fields or save the secrets
# DRIVE_CUE_ID / DRIVE_BIN_ID. The disc is only used to recompile the game executable; the .sisx
# contains no disc data. Toolchain: https://github.com/fieldops-dev/symbian3-toolchain
# (macOS runner; the first run builds GCC (~2 h) and caches it).

on:
  workflow_dispatch:
    inputs:
      cue_file_id:
        description: "Google Drive ID or link of your .cue (empty = secret DRIVE_CUE_ID)"
        required: false
        default: ""
        type: string
      bin_file_id:
        description: "Google Drive ID or link of your .bin (empty = secret DRIVE_BIN_ID)"
        required: false
        default: ""
        type: string
      opt:
        description: "GCC optimisation (-O2 fast, -Os smaller exe)"
        required: true
        default: "-O2"
        type: choice
        options:
          - "-O2"
          - "-Os"
          - "-O3"
      runner:
        description: "macOS runner label for the Symbian build (try another one if the job is never picked up)"
        required: true
        default: "macos-15"
        type: choice
        options:
          - "macos-15"
          - "macos-14"
          - "macos-latest"
          - "macos-26"

permissions:
  contents: read

env:
  TOOLCHAIN_REPO: fieldops-dev/symbian3-toolchain
  TOOLCHAIN_REF: a96f917e6c8f02fe4f7c2186f8df760d3d9d832a
  SYMBIAN_VOL: /Volumes/Symbian
  GNUPOC_COMMIT: d3ddaf58c734ad3ab34dc60a012f9d4768a9ed3e
  GCC4SYMBIAN_COMMIT: fe1b15a1c25716d5c515f12593080d58f14d4c3f

jobs:
  sources:
    name: Recompile disc, write port sources, patch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch disc image (yours, from Google Drive)
        env:
          CUE_FILE_ID: ${{ inputs.cue_file_id || secrets.DRIVE_CUE_ID }}
          BIN_FILE_ID: ${{ inputs.bin_file_id || secrets.DRIVE_BIN_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CUE_FILE_ID:-}" ] || [ -z "${BIN_FILE_ID:-}" ]; then
            echo "::error::Disc IDs missing. Fill cue_file_id + bin_file_id, or set secrets DRIVE_CUE_ID / DRIVE_BIN_ID."
            exit 1
          fi
          extract_id() { echo "$1" | tr -d ' \r\n' | sed -E 's#.*/d/([A-Za-z0-9_-]+).*#\1#; s#.*[?&]id=([A-Za-z0-9_-]+).*#\1#'; }
          CUE_FILE_ID="$(extract_id "$CUE_FILE_ID")"; BIN_FILE_ID="$(extract_id "$BIN_FILE_ID")"
          mkdir -p "$RUNNER_TEMP/disc"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q gdown
          GDOWN="$RUNNER_TEMP/venv/bin/gdown"
          "$GDOWN" "$CUE_FILE_ID" -O "$RUNNER_TEMP/disc/game.cue"
          "$GDOWN" "$BIN_FILE_ID" -O "$RUNNER_TEMP/disc/game.bin"
          sed -i -E 's/^FILE "[^"]+"/FILE "game.bin"/' "$RUNNER_TEMP/disc/game.cue"
          grep -q TRACK "$RUNNER_TEMP/disc/game.cue" || { echo "::error::game.cue has no TRACK line (Drive sharing must be 'Anyone with the link')"; cat "$RUNNER_TEMP/disc/game.cue"; exit 1; }
          ls -la "$RUNNER_TEMP/disc"

      - name: Recompile (ELF -> C# -> C)
        run: |
          set -euo pipefail
          chmod +x ./scripts/prerecompile_native.sh
          ./scripts/prerecompile_native.sh "$RUNNER_TEMP/disc/game.cue" 2>&1 | tee build-recomp.log

      - name: Generate symbian/ tree and patch sources
        env:
          OPT: ${{ inputs.opt || '-O2' }}
        run: |
          set -e
          mkdir -p symbian/app/data
          cat > symbian/app/data/crashrecomp.rss <<'CR_EOF'
          NAME CRSH

          #include <eikon.rh>
          #include <avkon.rh>
          #include <avkon.rsg>
          #include <appinfo.rh>

          RESOURCE RSS_SIGNATURE { }

          RESOURCE TBUF r_default_document_name { buf = ""; }

          RESOURCE EIK_APP_INFO
              {
              }

          RESOURCE LOCALISABLE_APP_INFO r_localisable_app_info
              {
              short_caption = "Crash";
              caption_and_icon = CAPTION_AND_ICON_INFO
                  {
                  caption = "Crash Bandicoot";
                  number_of_icons = 0;
                  };
              }
          CR_EOF
          mkdir -p symbian/app/data
          cat > symbian/app/data/crashrecomp_reg.rss <<'CR_EOF'
          #include <appinfo.rh>
          #include <crashrecomp.rsg>

          UID2 KUidAppRegistrationResourceFile
          UID3 0xE1C4A5B0

          RESOURCE APP_REGISTRATION_INFO
              {
              app_file = "crashrecomp";
              localisable_resource_file = "\\resource\\apps\\crashrecomp";
              localisable_resource_id = R_LOCALISABLE_APP_INFO;
              embeddability = KAppNotEmbeddable;
              newfile = KAppDoesNotSupportNewFile;
              }
          CR_EOF
          mkdir -p symbian/app/group
          cat > symbian/app/group/bld.inf <<'CR_EOF'
          PRJ_PLATFORMS
          DEFAULT

          PRJ_MMPFILES
          crashrecomp.mmp
          CR_EOF
          mkdir -p symbian/app/group
          cat > symbian/app/group/crashrecomp.mmp.in <<'CR_EOF'
          // Crash Bandicoot (static recompilation, native C runtime, OpenGL ES 2.0) for Symbian^3.
          // crashrecomp.mmp is generated from this file by symbian/tools/patch_symbian.py.
          #include <platform_paths.hrh>

          TARGET          crashrecomp.exe
          TARGETTYPE      exe
          UID             0x100039CE 0xE1C4A5B0
          SECUREID        0xE1C4A5B0
          VENDORID        0
          CAPABILITY      NONE

          EPOCSTACKSIZE   0x80000
          EPOCHEAPSIZE    0x800000 0x8000000

          MACRO           NDEBUG
          MACRO           PSX_GLES2
          MACRO           Z3_MULTITOUCH
          MACRO           SYSTEM_VOLUME_MIXER_AVAILABLE=0

          SOURCEPATH      ../src
          SOURCE          crash_app.cpp
          SOURCE          crash_appui.cpp
          SOURCE          crash_container.cpp
          SOURCE          crash_audio.cpp
          SOURCE          crash_sleep.cpp
          SOURCE          crash_gl.cpp

          SOURCEPATH      ../../core
          SOURCE          psx_sym.c

          @CORE_SOURCES@
          USERINCLUDE     ../inc
          USERINCLUDE     ../../core
          USERINCLUDE     ../../compat
          USERINCLUDE     ../../../CrashBandicoot.Native/src
          USERINCLUDE     ../../../CrashBandicoot.Native/gen
          SYSTEMINCLUDE   /epoc32/include/stdapis
          APP_LAYER_SYSTEMINCLUDE

          SOURCEPATH      ../data
          START RESOURCE  crashrecomp.rss
          HEADER
          TARGETPATH      /resource/apps
          END

          START RESOURCE  crashrecomp_reg.rss
          TARGETPATH      /private/10003a3f/import/apps
          END

          LIBRARY         euser.lib apparc.lib cone.lib eikcore.lib avkon.lib eikcoctl.lib
          LIBRARY         fbscli.lib bitgdi.lib gdi.lib ws32.lib efsrv.lib
          LIBRARY         mediaclientaudiostream.lib bafl.lib
          LIBRARY         libc.lib libm.lib libpthread.lib
          LIBRARY         libEGL.lib libGLESv2.lib

          // ARM11 must not do unaligned accesses; the recompiled code wraps on signed overflow.
          OPTION          GCCE @OPT@ -fno-strict-aliasing -fwrapv -mno-unaligned-access -w
          OPTION          GCCE -Wno-error=implicit-function-declaration -Wno-error=int-conversion
          OPTION          GCCE -Wno-error=incompatible-pointer-types -Wno-error=implicit-int
          OPTION          GCCE -idirafter @GCCINC@
          CR_EOF
          mkdir -p symbian/app/inc
          cat > symbian/app/inc/crashrecomp.h <<'CR_EOF'
          // crashrecomp.h - Symbian^3 front end for the native Crash Bandicoot recompilation.
          #ifndef CRASHRECOMP_SYMBIAN_H
          #define CRASHRECOMP_SYMBIAN_H

          #include <aknapp.h>
          #include <akndoc.h>
          #include <aknappui.h>
          #include <coecntrl.h>
          #include <e32base.h>
          #include <f32file.h>
          #include <fbs.h>
          #include <mdaaudiosampleplayer.h>
          #include <mdaaudiooutputstream.h>

          #include "psx_sym.h"

          const TUid KUidCrash = { (TInt32)0xE1C4A5B0 };

          // Pulls PCM from the SPU mixer and queues it on a CMdaAudioOutputStream (UI thread).
          class CCrashAudio : public CBase, public MMdaAudioOutputStreamCallback
              {
          public:
              static CCrashAudio* NewL();
              ~CCrashAudio();
              void Suspend();
              void Resume();

              void MaoscOpenComplete(TInt aError);
              void MaoscBufferCopied(TInt aError, const TDesC8& aBuffer);
              void MaoscPlayComplete(TInt aError);

          private:
              CCrashAudio();
              void OpenStream();
              void Fill(TInt aSlot);

              enum { KSlots = 4, KFrames = PSYM_AUDIO_FRAMES, KBytes = PSYM_AUDIO_FRAMES * 4 };
              CMdaAudioOutputStream* iStream;
              TBool iReady;
              TBool iSuspended;
              TUint8 iBuf[KSlots][KBytes];
              TPtrC8 iDes[KSlots];
              };

          // Plain full-screen window that owns the EGL window surface (rendering happens on the emulation thread).
          class CCrashGlView : public CCoeControl
              {
          public:
              static CCrashGlView* NewL(const TRect& aRect);
              void Draw(const TRect& aRect) const;
              RWindow& GlWindow() { return Window(); }     // Window() is protected in CCoeControl
              // The pad/menu is a window-less child control drawn INTO this window (never a second window on top).
              void SetChild(CCoeControl* aChild) { iChild = aChild; }
              TInt CountComponentControls() const { return iChild ? 1 : 0; }
              CCoeControl* ComponentControl(TInt /*aIndex*/) const { return iChild; }
          private:
              CCoeControl* iChild;
              };

          // Window-less control inside the GL view window: loading/error text, touch pad, keys, overlay menu.
          class CCrashContainer : public CCoeControl
              {
          public:
              static CCrashContainer* NewL(const TRect& aRect, CCrashGlView* aView);
              ~CCrashContainer();
              void SetForeground(TBool aForeground);

              void Draw(const TRect& aRect) const;
              void SizeChanged();
              void HandlePointerEventL(const TPointerEvent& aEvent);
              TKeyResponse OfferKeyEventL(const TKeyEvent& aKeyEvent, TEventCode aType);

          private:
              enum TMode { ELoading, EPlay, EMenu, EError };
              enum { KMenuItems = 3, KMaxPtrs = 5 };

              CCrashContainer();
              void ConstructL(const TRect& aRect, CCrashGlView* aView);

              static TInt TickCb(TAny* aPtr);
              static TInt InitCb(TAny* aPtr);
              void Tick();
              void DoInit();
              void StartTimer();
              void StopTimer();
              TBool FindDataDir(TDes8& aPath);
              void SetError(const TDesC8& aText);
              void OpenMenu();
              void MenuActionL(TInt aIndex);
              void ComputeLayout();
              void UpdateTouchPad();
              void PushPad();
              TUint PadFromPoint(const TPoint& aPt) const;
              void DrawButton(CWindowGc& aGc, const TRect& aRect, const TDesC& aLabel, TBool aDown) const;
              void DrawPad(CWindowGc& aGc) const;
              void DrawMenu(CWindowGc& aGc) const;
              void DrawCentred(CWindowGc& aGc, const TDesC& aText, TInt aY) const;

              CCrashGlView* iView;
              CPeriodic* iTimer;
              CIdle* iIdle;
              CCrashAudio* iAudio;
              RFs iFs;

              TMode iMode;
              TBool iForeground;
              TBool iSound;
              TUint iLastTick;

              TBuf<160> iErrLine1;
              TBuf<160> iErrLine2;

              TUint iKeyPad;
              TUint iTouchPad;
              TBool iPtrDown[KMaxPtrs];
              TPoint iPtrPos[KMaxPtrs];

              TPoint iDpadCentre;
              TInt iDpadR;
              TRect iBtnCross, iBtnCircle, iBtnSquare, iBtnTri, iBtnL1, iBtnL2, iBtnR1, iBtnR2;
              TRect iBtnSelect, iBtnStart, iBtnMenu;
              TInt iMenuSel;
              };

          class CCrashAppUi : public CAknAppUi
              {
          public:
              void ConstructL();
              ~CCrashAppUi();
              void HandleCommandL(TInt aCommand);
              void HandleForegroundEventL(TBool aForeground);
              void HandleResourceChangeL(TInt aType);
          private:
              CCrashGlView* iView;
              CCrashContainer* iContainer;
              };

          class CCrashDocument : public CAknDocument
              {
          public:
              CCrashDocument(CEikApplication& aApp) : CAknDocument(aApp) {}
          private:
              CEikAppUi* CreateAppUiL();
              };

          class CCrashApplication : public CAknApplication
              {
          private:
              CApaDocument* CreateDocumentL();
              TUid AppDllUid() const;
              };

          #endif
          CR_EOF
          mkdir -p symbian/app/sis
          cat > symbian/app/sis/crashrecomp.pkg <<'CR_EOF'
          ; Crash Bandicoot (native recompilation) for Symbian^3 - paths are expanded by package-sis.sh
          &EN
          #{"Crash Bandicoot"},(0xE1C4A5B0),1,0,0

          %{"Crash Bandicoot recomp"}
          :"Symbian port"

          [0x20022E6D], 0, 0, 0, {"S60ProductID"}
          [0x1028315F], 0, 0, 0, {"S60ProductID"}
          [0x102752AE], 0, 0, 0, {"S60ProductID"}
          [0x102032BE], 0, 0, 0, {"S60ProductID"}
          [0x101F7961], 0, 0, 0, {"S60ProductID"}

          "$(epocroot)epoc32/release/$(platform)/$(target)/crashrecomp.exe"-"!:\sys\bin\crashrecomp.exe"
          "$(epocroot)epoc32/data/z/resource/apps/crashrecomp.rsc"-"!:\resource\apps\crashrecomp.rsc"
          "$(epocroot)epoc32/data/z/private/10003a3f/import/apps/crashrecomp_reg.rsc"-"!:\private\10003a3f\import\apps\crashrecomp_reg.rsc"
          "readme.txt"-"!:\crashbandicoot\readme.txt"
          CR_EOF
          mkdir -p symbian/app/sis
          cat > symbian/app/sis/readme.txt <<'CR_EOF'
          Put your own disc image here: one .cue plus its .bin (same folder, FILE line in the .cue must match the .bin name).
          Saves (memory cards) go to the saves subfolder, crash.log is written next to the .cue.
          CR_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/crash_app.cpp <<'CR_EOF'
          #include <eikstart.h>
          #include "crashrecomp.h"

          CApaDocument* CCrashApplication::CreateDocumentL() { return new (ELeave) CCrashDocument(*this); }
          TUid CCrashApplication::AppDllUid() const { return KUidCrash; }
          CEikAppUi* CCrashDocument::CreateAppUiL() { return new (ELeave) CCrashAppUi; }

          LOCAL_C CApaApplication* NewApplication() { return new CCrashApplication; }

          GLDEF_C TInt E32Main() { return EikStart::RunApplication(NewApplication); }
          CR_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/crash_appui.cpp <<'CR_EOF'
          #include <avkon.hrh>
          #include <eikon.hrh>
          #include <eikenv.h>
          #include <eikspane.h>
          #include <eikbtgpc.h>
          #include "crashrecomp.h"

          void CCrashAppUi::ConstructL()
              {
              BaseConstructL(CAknAppUi::EAknEnableSkin);
              SetOrientationL(CAknAppUiBase::EAppUiOrientationLandscape);

              CEikStatusPane* sp = StatusPane();
              if (sp) sp->MakeVisible(EFalse);
              CEikButtonGroupContainer* cba = Cba();
              if (cba) cba->MakeVisible(EFalse);

              iView = CCrashGlView::NewL(ApplicationRect());
              iContainer = CCrashContainer::NewL(ApplicationRect(), iView);
              iView->SetChild(iContainer);
              AddToStackL(iContainer);
              }

          CCrashAppUi::~CCrashAppUi()
              {
              if (iContainer)
                  {
                  RemoveFromStack(iContainer);
                  delete iContainer;
                  iContainer = NULL;
                  }
              delete iView;
              iView = NULL;
              }

          void CCrashAppUi::HandleCommandL(TInt aCommand)
              {
              switch (aCommand)
                  {
                  case EEikCmdExit:
                  case EAknSoftkeyExit:
                  case EAknCmdExit:
                      Exit();
                      break;
                  default:
                      break;
                  }
              }

          void CCrashAppUi::HandleForegroundEventL(TBool aForeground)
              {
              CAknAppUi::HandleForegroundEventL(aForeground);
              if (iContainer) iContainer->SetForeground(aForeground);
              }

          void CCrashAppUi::HandleResourceChangeL(TInt aType)
              {
              CAknAppUi::HandleResourceChangeL(aType);
              if (iContainer && aType == KEikDynamicLayoutVariantSwitch)
                  {
                  iView->SetRect(ApplicationRect());
                  iContainer->SetRect(ApplicationRect());
                  }
              }
          CR_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/crash_audio.cpp <<'CR_EOF'
          // Audio output through CMdaAudioOutputStream: 44.1 kHz stereo PCM16 pulled from the SPU mixer.
          #include "crashrecomp.h"

          static const TInt KRate44100 = 0x00000020;   // TMdaAudioDataSettings::ESampleRate44100Hz
          static const TInt KStereo = 0x00000002;      // TMdaAudioDataSettings::EChannelsStereo

          CCrashAudio* CCrashAudio::NewL()
              {
              CCrashAudio* self = new (ELeave) CCrashAudio;
              self->OpenStream();
              return self;
              }

          CCrashAudio::CCrashAudio()
              {
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  Mem::FillZ(iBuf[i], KBytes);
                  iDes[i].Set(iBuf[i], KBytes);
                  }
              }

          CCrashAudio::~CCrashAudio()
              {
              if (iStream)
                  {
                  iStream->Stop();
                  delete iStream;
                  }
              }

          void CCrashAudio::OpenStream()
              {
              iReady = EFalse;
              delete iStream;
              iStream = NULL;
              TRAPD(err, iStream = CMdaAudioOutputStream::NewL(*this));
              if (err == KErrNone && iStream) iStream->Open(NULL);
              }

          void CCrashAudio::Fill(TInt aSlot)
              {
              PSym_MixAudio((short*)iBuf[aSlot], KFrames);
              TRAPD(err, iStream->WriteL(iDes[aSlot]));
              (void)err;
              }

          void CCrashAudio::MaoscOpenComplete(TInt aError)
              {
              if (aError != KErrNone) return;
              TRAPD(err, iStream->SetAudioPropertiesL(KRate44100, KStereo));
              if (err != KErrNone) return;
              iStream->SetVolume(iStream->MaxVolume() / 2);
              iStream->SetPriority(EPriorityNormal, EMdaPriorityPreferenceTime);
              iReady = ETrue;
              for (TInt i = 0; i < KSlots; ++i) Fill(i);
              }

          void CCrashAudio::MaoscBufferCopied(TInt aError, const TDesC8& aBuffer)
              {
              if (aError != KErrNone || !iReady || iSuspended) return;
              for (TInt i = 0; i < KSlots; ++i)
                  {
                  if (iBuf[i] == aBuffer.Ptr())
                      {
                      Fill(i);
                      return;
                      }
                  }
              }

          void CCrashAudio::MaoscPlayComplete(TInt /*aError*/) {}

          void CCrashAudio::Suspend()
              {
              iSuspended = ETrue;
              if (iStream && iReady)
                  {
                  iStream->Stop();
                  iReady = EFalse;
                  }
              }

          void CCrashAudio::Resume()
              {
              if (iSuspended)
                  {
                  iSuspended = EFalse;
                  OpenStream();
                  }
              }
          CR_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/crash_container.cpp <<'CR_EOF'
          // Main control: loading/error screens, game view, multi-touch PlayStation pad, overlay menu.
          #include <aknutils.h>
          #include <avkon.hrh>
          #include <eikon.hrh>
          #include <eikenv.h>
          #include <w32std.h>
          #include "crashrecomp.h"

          _LIT(KLoading1, "Starting Crash Bandicoot...");
          _LIT(KLoading2, "(starting the GLES2 renderer)");
          _LIT(KErrTitle, "Crash Bandicoot could not start");
          _LIT(KErrHint, "Needed: <drive>:\\crashbandicoot\\ with your .cue + .bin");

          static const TInt KTickMicros = 33000;

          CCrashGlView* CCrashGlView::NewL(const TRect& aRect)
              {
              CCrashGlView* self = new (ELeave) CCrashGlView;
              self->iChild = NULL;
              CleanupStack::PushL(self);
              self->CreateWindowL();
              self->SetExtentToWholeScreen();
              // Black comes from the window background, NOT from Draw(): a WSERV window paints its own
              // content (gc commands) on top of the EGL surface (EKA2L1 does exactly that), so a black
              // Clear() in Draw() hides every GL frame -> permanent black screen.
              self->Window().SetBackgroundColor(KRgbBlack);
              self->SetRect(aRect);
              self->ActivateL();
              CleanupStack::Pop(self);
              return self;
              }

          void CCrashGlView::Draw(const TRect& /*aRect*/) const
              {
              // Intentionally empty: the EGL window surface owns this window's pixels.
              }

          CCrashContainer* CCrashContainer::NewL(const TRect& aRect, CCrashGlView* aView)
              {
              CCrashContainer* self = new (ELeave) CCrashContainer;
              CleanupStack::PushL(self);
              self->ConstructL(aRect, aView);
              CleanupStack::Pop(self);
              return self;
              }

          CCrashContainer::CCrashContainer() {}

          CCrashContainer::~CCrashContainer()
              {
              StopTimer();
              PSym_SetPad(0);
              PSym_Flush();
              delete iTimer;
              delete iIdle;
              delete iAudio;
              iFs.Close();
              }

          void CCrashContainer::ConstructL(const TRect& aRect, CCrashGlView* aView)
              {
              iView = aView;
              // No window of its own: a second (alpha) window above the GL window is composited as opaque black by
              // EKA2L1 and hides every GL frame. Draw inside the GL view's window instead.
              SetContainerWindowL(*aView);
              EnableDragEvents();
          #ifdef Z3_MULTITOUCH
              Window().EnableAdvancedPointers();
          #endif
              SetFocusing(ETrue);
              User::LeaveIfError(iFs.Connect());

              iMode = ELoading;
              iSound = ETrue;
              iForeground = ETrue;
              iMenuSel = 0;
              for (TInt i = 0; i < KMaxPtrs; ++i) iPtrDown[i] = EFalse;

              SetRect(aRect);
              ActivateL();

              iTimer = CPeriodic::NewL(CActive::EPriorityStandard);
              iIdle = CIdle::NewL(CActive::EPriorityIdle);
              iIdle->Start(TCallBack(InitCb, this));     // lets the loading screen appear first
              }

          TInt CCrashContainer::InitCb(TAny* aPtr)
              {
              static_cast<CCrashContainer*>(aPtr)->DoInit();
              return 0;
              }

          void CCrashContainer::SetError(const TDesC8& aText)
              {
              iErrLine1.Zero();
              iErrLine2.Zero();
              TInt len = aText.Length();
              TInt split = 58;
              if (len <= split)
                  {
                  iErrLine1.Copy(aText);
                  }
              else
                  {
                  TInt cut = split;
                  while (cut > 20 && aText[cut] != 32) --cut;
                  iErrLine1.Copy(aText.Left(cut));
                  iErrLine2.Copy(aText.Mid(cut).Left(iErrLine2.MaxLength()));
                  }
              iMode = EError;
              }

          // First drive whose \crashbandicoot\ folder holds a .cue file (E: mass memory and F: card first).
          TBool CCrashContainer::FindDataDir(TDes8& aPath)
              {
              TDriveList list;
              if (iFs.DriveList(list) != KErrNone) return EFalse;
              const TInt order[8] = { 4, 5, 2, 6, 7, 3, 8, 9 };
              for (TInt k = 0; k < 8; ++k)
                  {
                  TInt d = order[k];
                  if (d >= KMaxDrives || !list[d]) continue;
                  TBuf8<32> dir;
                  dir.Append((TChar)('A' + d));
                  dir.Append(_L8(":/crashbandicoot"));
                  dir.ZeroTerminate();
                  if (PSym_Probe((const char*)dir.Ptr()))
                      {
                      aPath.Copy(dir);
                      return ETrue;
                      }
                  }
              return EFalse;
              }

          void CCrashContainer::DoInit()
              {
              TBuf8<64> path;
              if (!FindDataDir(path))
                  {
                  SetError(_L8("No .cue file found in <drive>:\\crashbandicoot\\"));
                  DrawNow();
                  return;
                  }
              path.ZeroTerminate();
              RWindow& glWin = iView->GlWindow();
              const char* glErr = PSym_GlInit(&glWin);
              if (glErr)
                  {
                  TPtrC8 msg((const TUint8*)glErr);
                  SetError(msg);
                  DrawNow();
                  return;
                  }
              if (PSym_Start((const char*)path.Ptr()) != 0)
                  {
                  const char* e = PSym_Error();
                  TPtrC8 msg((const TUint8*)(e ? e : "start failed"));
                  SetError(msg);
                  DrawNow();
                  return;
                  }
              TRAPD(aerr, iAudio = CCrashAudio::NewL());
              if (aerr != KErrNone) iAudio = NULL;

              iMode = EPlay;
              StartTimer();
              DrawNow();
              }

          void CCrashContainer::StartTimer()
              {
              if (iTimer && !iTimer->IsActive())
                  {
                  iLastTick = User::NTickCount();
                  iTimer->Start(KTickMicros, KTickMicros, TCallBack(TickCb, this));
                  }
              }

          void CCrashContainer::StopTimer()
              {
              if (iTimer) iTimer->Cancel();
              }

          void CCrashContainer::SetForeground(TBool aForeground)
              {
              iForeground = aForeground;
              if (!aForeground)
                  {
                  PSym_SetPaused(1);
                  PSym_Flush();
                  if (iAudio) iAudio->Suspend();
                  StopTimer();
                  }
              else
                  {
                  if (iAudio) iAudio->Resume();
                  if (iMode == EPlay)
                      {
                      PSym_SetPaused(0);
                      StartTimer();
                      }
                  }
              }

          TInt CCrashContainer::TickCb(TAny* aPtr)
              {
              static_cast<CCrashContainer*>(aPtr)->Tick();
              return 0;
              }

          // Poll: fatal error? new frame? (the emulation thread paces itself at 60 Hz)
          void CCrashContainer::Tick()
              {
              if (iMode != EPlay || !iForeground) return;

              const char* e = PSym_Error();
              if (e)
                  {
                  TPtrC8 msg((const TUint8*)e);
                  SetError(msg);
                  StopTimer();
                  DrawNow();
                  return;
                  }

              PSym_UiPresent();                       // the UI thread owns the EGL window surface: draw the newest frame + swap

              TUint now = User::NTickCount();
              TUint elapsed = now - iLastTick;
              iLastTick = now;
              if (!iAudio)
                  {
                  // no audio stream: keep the SPU/XA machinery running at real time
                  TInt16 abuf[PSYM_AUDIO_FRAMES * 2];
                  TInt frames = (TInt)(elapsed > 100 ? 100 : elapsed) * 44;
                  while (frames > 0)
                      {
                      TInt n = frames > PSYM_AUDIO_FRAMES ? PSYM_AUDIO_FRAMES : frames;
                      PSym_MixAudio(abuf, n);
                      frames -= n;
                      }
                  }

              }

          void CCrashContainer::PushPad()
              {
              PSym_SetPad(iKeyPad | iTouchPad);
              }

          void CCrashContainer::OpenMenu()
              {
              iTouchPad = 0;
              iKeyPad = 0;
              for (TInt i = 0; i < KMaxPtrs; ++i) iPtrDown[i] = EFalse;
              PushPad();
              iMode = EMenu;
              iMenuSel = 0;
              PSym_SetPaused(1);
              DrawNow();
              }

          void CCrashContainer::MenuActionL(TInt aIndex)
              {
              switch (aIndex)
                  {
                  case 0:
                      break;
                  case 1:
                      iSound = !iSound;
                      PSym_SetSound(iSound);
                      DrawNow();
                      return;
                  default:
                      PSym_Flush();
                      iEikonEnv->EikAppUi()->HandleCommandL(EEikCmdExit);
                      return;
                  }
              iMode = EPlay;
              PSym_SetPaused(0);
              DrawNow();
              }

          // ---------------------------------------------------------------------------
          // Layout and drawing
          // ---------------------------------------------------------------------------
          void CCrashContainer::SizeChanged()
              {
              ComputeLayout();
              }

          void CCrashContainer::ComputeLayout()
              {
              TRect r = Rect();
              TInt w = r.Width(), h = r.Height();
              TInt R = Min(h / 4, w / 6);
              if (R < 30) R = 30;
              iDpadR = R;
              iDpadCentre = TPoint(R + 8, h - R - 24);

              // face buttons: triangle top, cross bottom, square left, circle right
              TInt br = R * 3 / 10;
              TPoint c(w - R - 8, h - R - 24);
              TInt off = br * 12 / 10;
              iBtnCircle = TRect(c.iX + off - br, c.iY - br, c.iX + off + br, c.iY + br);
              iBtnSquare = TRect(c.iX - off - br, c.iY - br, c.iX - off + br, c.iY + br);
              iBtnTri    = TRect(c.iX - br, c.iY - off - br, c.iX + br, c.iY - off + br);
              iBtnCross  = TRect(c.iX - br, c.iY + off - br, c.iX + br, c.iY + off + br);

              TInt sw = 84, sh = 36;
              iBtnL1 = TRect(6, 6, 96, 44);
              iBtnL2 = TRect(6, 50, 96, 88);
              iBtnR1 = TRect(w - 96, 6, w - 6, 44);
              iBtnR2 = TRect(w - 96, 50, w - 6, 88);
              iBtnSelect = TRect(w / 2 - sw - 8, h - sh - 6, w / 2 - 8, h - 6);
              iBtnStart = TRect(w / 2 + 8, h - sh - 6, w / 2 + sw + 8, h - 6);
              iBtnMenu = TRect(w / 2 - 40, 4, w / 2 + 40, 40);
              }

          static const TRgb KLine(255, 255, 255, 150);
          static const TRgb KFill(0, 0, 0, 0);   // (only used as 'no fill' marker)
          static const TRgb KHot(110, 110, 255, 150);
          static const TRgb KText(255, 255, 255, 220);

          void CCrashContainer::DrawButton(CWindowGc& aGc, const TRect& aRect, const TDesC& aLabel, TBool aDown) const
              {
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(KLine);
              if (aDown) { aGc.SetBrushStyle(CGraphicsContext::ESolidBrush); aGc.SetBrushColor(KHot); }
              else aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
              aGc.DrawRect(aRect);
              aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              aGc.SetPenColor(KText);
              TInt base = (aRect.Height() + font->AscentInPixels() - font->DescentInPixels()) / 2;
              aGc.DrawText(aLabel, aRect, base, CGraphicsContext::ECenter, 0);
              aGc.DiscardFont();
              }

          void CCrashContainer::DrawPad(CWindowGc& aGc) const
              {
              const TUint p = iKeyPad | iTouchPad;
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(KLine);
              aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
              TRect pad(iDpadCentre.iX - iDpadR, iDpadCentre.iY - iDpadR, iDpadCentre.iX + iDpadR, iDpadCentre.iY + iDpadR);
              aGc.DrawRect(pad);      // (DrawEllipse: gc opcode 60, not implemented in EKA2L1)
              TInt q = iDpadR / 3;
              TRect up(iDpadCentre.iX - q, iDpadCentre.iY - iDpadR, iDpadCentre.iX + q, iDpadCentre.iY - q);
              TRect dn(iDpadCentre.iX - q, iDpadCentre.iY + q, iDpadCentre.iX + q, iDpadCentre.iY + iDpadR);
              TRect lf(iDpadCentre.iX - iDpadR, iDpadCentre.iY - q, iDpadCentre.iX - q, iDpadCentre.iY + q);
              TRect rt(iDpadCentre.iX + q, iDpadCentre.iY - q, iDpadCentre.iX + iDpadR, iDpadCentre.iY + q);
              aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              aGc.SetBrushColor(KHot);
              if (p & PSYM_PAD_UP) aGc.DrawRect(up);
              if (p & PSYM_PAD_DOWN) aGc.DrawRect(dn);
              if (p & PSYM_PAD_LEFT) aGc.DrawRect(lf);
              if (p & PSYM_PAD_RIGHT) aGc.DrawRect(rt);
              aGc.SetBrushStyle(CGraphicsContext::ENullBrush);
              aGc.DrawLine(TPoint(iDpadCentre.iX - iDpadR, iDpadCentre.iY), TPoint(iDpadCentre.iX + iDpadR, iDpadCentre.iY));
              aGc.DrawLine(TPoint(iDpadCentre.iX, iDpadCentre.iY - iDpadR), TPoint(iDpadCentre.iX, iDpadCentre.iY + iDpadR));
              DrawButton(aGc, iBtnCross, _L("X"), p & PSYM_PAD_CROSS);
              DrawButton(aGc, iBtnCircle, _L("O"), p & PSYM_PAD_CIRCLE);
              DrawButton(aGc, iBtnSquare, _L("S"), p & PSYM_PAD_SQUARE);
              DrawButton(aGc, iBtnTri, _L("T"), p & PSYM_PAD_TRIANGLE);
              DrawButton(aGc, iBtnL1, _L("L1"), p & PSYM_PAD_L1);
              DrawButton(aGc, iBtnL2, _L("L2"), p & PSYM_PAD_L2);
              DrawButton(aGc, iBtnR1, _L("R1"), p & PSYM_PAD_R1);
              DrawButton(aGc, iBtnR2, _L("R2"), p & PSYM_PAD_R2);
              DrawButton(aGc, iBtnSelect, _L("Select"), p & PSYM_PAD_SELECT);
              DrawButton(aGc, iBtnStart, _L("Start"), p & PSYM_PAD_START);
              DrawButton(aGc, iBtnMenu, _L("Menu"), EFalse);
              }

          void CCrashContainer::DrawCentred(CWindowGc& aGc, const TDesC& aText, TInt aY) const
              {
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              TRect line(0, aY, Rect().Width(), aY + font->HeightInPixels() + 8);
              aGc.DrawText(aText, line, font->AscentInPixels() + 4, CGraphicsContext::ECenter, 0);
              aGc.DiscardFont();
              }

          void CCrashContainer::DrawMenu(CWindowGc& aGc) const
              {
              TRect r = Rect();
              TInt w = 340, rh = 40, h = KMenuItems * rh;
              TRect box((r.Width() - w) / 2, (r.Height() - h) / 2, (r.Width() + w) / 2, (r.Height() + h) / 2);
              aGc.SetPenStyle(CGraphicsContext::ESolidPen);
              aGc.SetPenColor(KLine);
              aGc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              aGc.SetBrushColor(TRgb(20, 20, 40, 235));
              aGc.DrawRect(box);
              const CFont* font = iEikonEnv->NormalFont();
              aGc.UseFont(font);
              for (TInt i = 0; i < KMenuItems; ++i)
                  {
                  TRect row(box.iTl.iX + 2, box.iTl.iY + i * rh + 2, box.iBr.iX - 2, box.iTl.iY + (i + 1) * rh - 2);
                  if (i == iMenuSel)
                      {
                      aGc.SetBrushColor(TRgb(70, 70, 140, 255));
                      aGc.SetPenStyle(CGraphicsContext::ENullPen);
                      aGc.DrawRect(row);
                      aGc.SetPenStyle(CGraphicsContext::ESolidPen);
                      }
                  aGc.SetPenColor(TRgb(255, 255, 255, 255));
                  TBuf<40> label;
                  switch (i)
                      {
                      case 0: label = _L("Resume"); break;
                      case 1: label = iSound ? _L("Sound: on") : _L("Sound: off"); break;
                      default: label = _L("Exit"); break;
                      }
                  TInt base = (row.Height() + font->AscentInPixels() - font->DescentInPixels()) / 2;
                  aGc.DrawText(label, row, base, CGraphicsContext::ECenter, 0);
                  aGc.SetBrushColor(TRgb(20, 20, 40, 235));
                  }
              aGc.DiscardFont();
              }

          void CCrashContainer::Draw(const TRect& /*aRect*/) const
              {
              CWindowGc& gc = SystemGc();
              gc.SetPenStyle(CGraphicsContext::ESolidPen);
              gc.SetBrushStyle(CGraphicsContext::ESolidBrush);

              if (iMode == ELoading || iMode == EError)
                  {
                  gc.SetBrushColor(TRgb(0, 0, 0, 255));
                  gc.Clear(Rect());
                  gc.SetPenColor(TRgb(255, 255, 255, 255));
                  TInt y = Rect().Height() / 2 - 50;
                  if (iMode == ELoading)
                      {
                      DrawCentred(gc, KLoading1, y);
                      DrawCentred(gc, KLoading2, y + 34);
                      }
                  else
                      {
                      DrawCentred(gc, KErrTitle, y);
                      DrawCentred(gc, iErrLine1, y + 34);
                      DrawCentred(gc, iErrLine2, y + 60);
                      DrawCentred(gc, KErrHint, y + 100);
                      }
                  return;
                  }

              DrawPad(gc);
              if (iMode == EMenu) DrawMenu(gc);
              }

          // ---------------------------------------------------------------------------
          // Input
          // ---------------------------------------------------------------------------
          TUint CCrashContainer::PadFromPoint(const TPoint& aPt) const
              {
              TUint bits = 0;
              if (iBtnCross.Contains(aPt)) bits |= PSYM_PAD_CROSS;
              if (iBtnCircle.Contains(aPt)) bits |= PSYM_PAD_CIRCLE;
              if (iBtnSquare.Contains(aPt)) bits |= PSYM_PAD_SQUARE;
              if (iBtnTri.Contains(aPt)) bits |= PSYM_PAD_TRIANGLE;
              if (iBtnL1.Contains(aPt)) bits |= PSYM_PAD_L1;
              if (iBtnL2.Contains(aPt)) bits |= PSYM_PAD_L2;
              if (iBtnR1.Contains(aPt)) bits |= PSYM_PAD_R1;
              if (iBtnR2.Contains(aPt)) bits |= PSYM_PAD_R2;
              if (iBtnSelect.Contains(aPt)) bits |= PSYM_PAD_SELECT;
              if (iBtnStart.Contains(aPt)) bits |= PSYM_PAD_START;
              TInt dx = aPt.iX - iDpadCentre.iX;
              TInt dy = aPt.iY - iDpadCentre.iY;
              TInt lim = iDpadR + iDpadR / 3;
              if (dx > -lim && dx < lim && dy > -lim && dy < lim)
                  {
                  TInt dead = iDpadR / 4;
                  if (dx < -dead) bits |= PSYM_PAD_LEFT;
                  if (dx > dead) bits |= PSYM_PAD_RIGHT;
                  if (dy < -dead) bits |= PSYM_PAD_UP;
                  if (dy > dead) bits |= PSYM_PAD_DOWN;
                  }
              return bits;
              }

          void CCrashContainer::UpdateTouchPad()
              {
              TUint bits = 0;
              for (TInt i = 0; i < KMaxPtrs; ++i)
                  if (iPtrDown[i]) bits |= PadFromPoint(iPtrPos[i]);
              iTouchPad = bits;
              PushPad();
              }

          void CCrashContainer::HandlePointerEventL(const TPointerEvent& aEvent)
              {
              const TPoint pt = aEvent.iPosition;
              TInt id = 0;
          #ifdef Z3_MULTITOUCH
              const TAdvancedPointerEvent* adv = aEvent.AdvancedPointerEvent();
              if (adv) id = adv->PointerNumber();
          #endif
              if (id < 0 || id >= KMaxPtrs) return;

              if (iMode == EPlay)
                  {
                  if (aEvent.iType == TPointerEvent::EButton1Down && iBtnMenu.Contains(pt))
                      {
                      OpenMenu();
                      return;
                      }
                  if (aEvent.iType == TPointerEvent::EButton1Down || aEvent.iType == TPointerEvent::EDrag)
                      {
                      iPtrDown[id] = ETrue;
                      iPtrPos[id] = pt;
                      }
                  else if (aEvent.iType == TPointerEvent::EButton1Up)
                      {
                      iPtrDown[id] = EFalse;
                      }
                  UpdateTouchPad();
                  return;
                  }

              if (iMode == EMenu)
                  {
                  if (aEvent.iType == TPointerEvent::EButton1Up)
                      {
                      TRect r = Rect();
                      TInt w = 340, rh = 40, h = KMenuItems * rh;
                      TRect box((r.Width() - w) / 2, (r.Height() - h) / 2, (r.Width() + w) / 2, (r.Height() + h) / 2);
                      if (box.Contains(pt)) MenuActionL((pt.iY - box.iTl.iY) / rh);
                      else MenuActionL(0);
                      }
                  return;
                  }

              if (iMode == EError && aEvent.iType == TPointerEvent::EButton1Up)
                  iEikonEnv->EikAppUi()->HandleCommandL(EEikCmdExit);
              }

          TKeyResponse CCrashContainer::OfferKeyEventL(const TKeyEvent& aKey, TEventCode aType)
              {
              const TInt sc = aKey.iScanCode;

              if (iMode == EPlay)
                  {
                  TUint bit = 0;
                  switch (sc)
                      {
                      case EStdKeyUpArrow:    bit = PSYM_PAD_UP; break;
                      case EStdKeyDownArrow:  bit = PSYM_PAD_DOWN; break;
                      case EStdKeyLeftArrow:  bit = PSYM_PAD_LEFT; break;
                      case EStdKeyRightArrow: bit = PSYM_PAD_RIGHT; break;
                      case 'X': case EStdKeySpace: bit = PSYM_PAD_CROSS; break;    // jump
                      case 'Z':               bit = PSYM_PAD_SQUARE; break;        // spin
                      case 'C':               bit = PSYM_PAD_CIRCLE; break;
                      case 'S':               bit = PSYM_PAD_TRIANGLE; break;
                      case 'Q':               bit = PSYM_PAD_L1; break;
                      case 'W':               bit = PSYM_PAD_R1; break;
                      case 'A':               bit = PSYM_PAD_L2; break;
                      case 'D':               bit = PSYM_PAD_R2; break;
                      case EStdKeyEnter: case EStdKeyDevice3: bit = PSYM_PAD_START; break;
                      case EStdKeyBackspace:  bit = PSYM_PAD_SELECT; break;
                      default: break;
                      }
                  if (aType == EEventKeyDown && sc == EStdKeyDevice0)      // left soft key
                      {
                      OpenMenu();
                      return EKeyWasConsumed;
                      }
                  if (bit)
                      {
                      if (aType == EEventKeyDown) iKeyPad |= bit;
                      else if (aType == EEventKeyUp) iKeyPad &= ~bit;
                      PushPad();
                      return EKeyWasConsumed;
                      }
                  return EKeyWasNotConsumed;
                  }

              if (aType != EEventKeyDown)
                  {
                  return (sc == EStdKeyUpArrow || sc == EStdKeyDownArrow || sc == EStdKeyEnter ||
                          sc == EStdKeyDevice3 || sc == EStdKeyDevice0) ? EKeyWasConsumed : EKeyWasNotConsumed;
                  }

              if (iMode == EMenu)
                  {
                  if (sc == EStdKeyUpArrow && iMenuSel > 0) --iMenuSel;
                  else if (sc == EStdKeyDownArrow && iMenuSel < KMenuItems - 1) ++iMenuSel;
                  else if (sc == EStdKeyEnter || sc == EStdKeyDevice3) { MenuActionL(iMenuSel); return EKeyWasConsumed; }
                  else if (sc == EStdKeyDevice0) { MenuActionL(0); return EKeyWasConsumed; }
                  else return EKeyWasNotConsumed;
                  DrawNow();
                  return EKeyWasConsumed;
                  }

              if (iMode == EError && (sc == EStdKeyEnter || sc == EStdKeyDevice3 || sc == EStdKeyDevice0))
                  {
                  iEikonEnv->EikAppUi()->HandleCommandL(EEikCmdExit);
                  return EKeyWasConsumed;
                  }
              return EKeyWasNotConsumed;
              }
          CR_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/crash_gl.cpp <<'CR_EOF'
          // EGL / OpenGL ES 2.0 host for the GLES2 GPU backend.
          // Threading model (Symbian^3 / Broadcom VideoCore III): the EGL *window surface* is created, made current and swapped
          // ONLY on the UI thread (creating or swapping it from another thread hangs forever on this hardware). The emulation
          // thread gets its own context that SHARES objects with the UI context, bound to a 1x1 pbuffer: it renders VRAM into a
          // texture and never touches the window. The UI thread draws that texture to the window and swaps (PSym_UiPresent).
          #include <e32std.h>
          #include <w32std.h>
          #include <EGL/egl.h>
          #include "psx_sym.h"

          extern "C" {
          void plat_log(const char *fmt, ...);
          void plat_fatal(const char *msg);
          void plat_gl_make_current(void);
          void plat_gl_screen(int *fbo, int *w, int *h);
          }

          static EGLDisplay gDpy = EGL_NO_DISPLAY;
          static EGLSurface gSurf = EGL_NO_SURFACE, gPb = EGL_NO_SURFACE;
          static EGLContext gCtxUi = EGL_NO_CONTEXT, gCtxEmu = EGL_NO_CONTEXT;
          static EGLConfig gCfg, gCfgPb;
          static volatile int gEmuCurrent = 0, gUiReady = 0, gSingle = 0;
          static int gW = 640, gH = 360;

          static EGLBoolean Choose(const EGLint* aAttr, EGLConfig* aOut)
              {
              EGLint n = 0;
              return eglChooseConfig(gDpy, aAttr, aOut, 1, &n) && n > 0;
              }

          static void LogCfg(const char* aTag, EGLConfig aCfg)
              {
              EGLint id = 0, r = 0, g = 0, b = 0, a = 0, d = 0, st = 0, ty = 0;
              eglGetConfigAttrib(gDpy, aCfg, EGL_CONFIG_ID, &id);
              eglGetConfigAttrib(gDpy, aCfg, EGL_RED_SIZE, &r);   eglGetConfigAttrib(gDpy, aCfg, EGL_GREEN_SIZE, &g);
              eglGetConfigAttrib(gDpy, aCfg, EGL_BLUE_SIZE, &b);  eglGetConfigAttrib(gDpy, aCfg, EGL_ALPHA_SIZE, &a);
              eglGetConfigAttrib(gDpy, aCfg, EGL_DEPTH_SIZE, &d); eglGetConfigAttrib(gDpy, aCfg, EGL_STENCIL_SIZE, &st);
              eglGetConfigAttrib(gDpy, aCfg, EGL_SURFACE_TYPE, &ty);
              plat_log("[EGL] %s config id=%d rgba=%d/%d/%d/%d depth=%d stencil=%d surfaceType=0x%x", aTag, (int)id, (int)r, (int)g, (int)b, (int)a, (int)d, (int)st, (unsigned)ty);
              }

          // UI thread, before the emulation thread exists.
          extern "C" const char *PSym_GlInit(void *aWindow)
              {
              plat_log("[EGL] init on the UI thread");
              gDpy = eglGetDisplay(EGL_DEFAULT_DISPLAY);
              if (gDpy == EGL_NO_DISPLAY) return "EGL: no display";
              EGLint maj = 0, min = 0;
              if (!eglInitialize(gDpy, &maj, &min)) return "EGL: eglInitialize failed";
              {
                  const char *ev = eglQueryString(gDpy, EGL_VENDOR), *evr = eglQueryString(gDpy, EGL_VERSION), *ec = eglQueryString(gDpy, EGL_CLIENT_APIS);
                  plat_log("[EGL] initialised %d.%d vendor=%s version=%s apis=%s", (int)maj, (int)min, ev ? ev : "?", evr ? evr : "?", ec ? ec : "?");
              }
              eglBindAPI(EGL_OPENGL_ES_API);

              const EGLint wp565[] = { EGL_SURFACE_TYPE, EGL_WINDOW_BIT | EGL_PBUFFER_BIT, EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT,
                                       EGL_RED_SIZE, 5, EGL_GREEN_SIZE, 6, EGL_BLUE_SIZE, 5, EGL_NONE };
              const EGLint wpAny[] = { EGL_SURFACE_TYPE, EGL_WINDOW_BIT | EGL_PBUFFER_BIT, EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT, EGL_NONE };
              const EGLint w565[]  = { EGL_SURFACE_TYPE, EGL_WINDOW_BIT, EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT,
                                       EGL_RED_SIZE, 5, EGL_GREEN_SIZE, 6, EGL_BLUE_SIZE, 5, EGL_NONE };
              const EGLint wAny[]  = { EGL_SURFACE_TYPE, EGL_WINDOW_BIT, EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT, EGL_NONE };
              const EGLint pAny[]  = { EGL_SURFACE_TYPE, EGL_PBUFFER_BIT, EGL_RENDERABLE_TYPE, EGL_OPENGL_ES2_BIT, EGL_NONE };
              bool one = false;
              if (Choose(wp565, &gCfg) || Choose(wpAny, &gCfg)) { gCfgPb = gCfg; one = true; }
              else if (Choose(w565, &gCfg) || Choose(wAny, &gCfg))
                  {
                  if (!Choose(pAny, &gCfgPb)) return "EGL: no pbuffer config for the emulation thread";
                  }
              else return "EGL: no OpenGL ES 2.0 window config (device without GLES2?)";
              LogCfg(one ? "window+pbuffer" : "window", gCfg);
              if (!one) LogCfg("pbuffer", gCfgPb);

              gSurf = eglCreateWindowSurface(gDpy, gCfg, (EGLNativeWindowType)aWindow, NULL);
              if (gSurf == EGL_NO_SURFACE)
                  {
                  plat_log("[EGL] eglCreateWindowSurface failed: 0x%x", (unsigned)eglGetError());
                  return "EGL: eglCreateWindowSurface failed";
                  }
              plat_log("[EGL] window surface created");

              const EGLint ctxAttr[] = { EGL_CONTEXT_CLIENT_VERSION, 2, EGL_NONE };
              gCtxUi = eglCreateContext(gDpy, gCfg, EGL_NO_CONTEXT, ctxAttr);
              if (gCtxUi == EGL_NO_CONTEXT) return "EGL: eglCreateContext (ES 2.0) failed";
              eglQuerySurface(gDpy, gSurf, EGL_WIDTH, &gW);
              eglQuerySurface(gDpy, gSurf, EGL_HEIGHT, &gH);
              plat_log("[EGL] surface %dx%d (UI context is made current only after the shared context exists)", (int)gW, (int)gH);

              const EGLint pbAttr[] = { EGL_WIDTH, 1, EGL_HEIGHT, 1, EGL_NONE };
              gPb = eglCreatePbufferSurface(gDpy, gCfgPb, pbAttr);
              if (gPb == EGL_NO_SURFACE)
                  plat_log("[EGL] eglCreatePbufferSurface failed: 0x%x (the emulation thread will try a surfaceless context)", (unsigned)eglGetError());
              else
                  plat_log("[EGL] pbuffer surface created");
              gCtxEmu = eglCreateContext(gDpy, gCfgPb, gCtxUi, ctxAttr);     // shares textures / programs with the UI context
              if (gCtxEmu == EGL_NO_CONTEXT)
                  {
                  plat_log("[EGL] shared eglCreateContext failed: 0x%x", (unsigned)eglGetError());
                  // Emulators (EKA2L1) cannot share contexts: single-context mode, like the older working design. Nothing was made current on
                  // the UI thread; the emulation thread binds the window context and presents itself, the UI thread stays out of GL.
                  gSingle = 1;
                  plat_log("[EGL] SINGLE-CONTEXT mode: the emulation thread owns the window context and swaps");
                  gUiReady = 1;
                  return NULL;
                  }
              plat_log("[EGL] shared context for the emulation thread created");
              if (!eglMakeCurrent(gDpy, gSurf, gSurf, gCtxUi))
                  {
                  plat_log("[EGL] UI eglMakeCurrent failed: 0x%x", (unsigned)eglGetError());
                  return "EGL: eglMakeCurrent failed on the UI thread";
                  }
              EGLBoolean si = eglSwapInterval(gDpy, 0);          // frameclock throttles the game; never wait for the compositor
              plat_log("[EGL] UI context current, swapInterval(0)=%d", (int)si);
              gUiReady = 1;
              return NULL;
              }

          // Emulation thread: binds its shared context (to the pbuffer). Cheap afterwards.
          extern "C" void plat_gl_make_current(void)
              {
              if (gEmuCurrent) return;
              eglBindAPI(EGL_OPENGL_ES_API);
              plat_log("[EGL] emulation thread: making the shared context current (%s) ...", gPb == EGL_NO_SURFACE ? "surfaceless" : "pbuffer");
              if (gSingle ? !eglMakeCurrent(gDpy, gSurf, gSurf, gCtxUi) : !eglMakeCurrent(gDpy, gPb, gPb, gCtxEmu))
                  {
                  plat_log("[EGL] emulation eglMakeCurrent failed: 0x%x", (unsigned)eglGetError());
                  plat_fatal("EGL: eglMakeCurrent failed on the emulation thread (see crash.log)");
                  }
              gEmuCurrent = 1;
              plat_log("[EGL] emulation context current");
              }

          extern "C" void plat_gl_screen(int *fbo, int *w, int *h)
              {
              *fbo = 0;
              *w = gW;
              *h = gH;
              }

          extern "C" int PSym_GlSingle(void) { return gSingle; }

          // UI thread only (emulation thread in single-context mode).
          extern "C" int PSym_GlSwap(void)
              {
              if (!gUiReady) return 0;
              if (!eglSwapBuffers(gDpy, gSurf))
                  {
                  static int logged;
                  if (logged++ < 8) plat_log("[EGL] eglSwapBuffers failed: 0x%x", (unsigned)eglGetError());
                  return 0;
                  }
              return 1;
              }
