      - name: Get SCUS_949.00 (Google Drive image or repo file)
        env:
          GDRIVE: ${{ inputs.gdrive_id }}
        run: |
          set -e
          if [ -n "$GDRIVE" ]; then
            pip install -q gdown
            sudo apt-get install -y -q p7zip-full >/dev/null
            mkdir -p dl && cd dl
            case "$GDRIVE" in
              http*) gdown --fuzzy "$GDRIVE" ;;
              *)     gdown "https://drive.google.com/uc?id=$GDRIVE" ;;
            esac
            for z in *.zip *.7z *.rar; do [ -f "$z" ] && 7z x -y "$z" >/dev/null && rm -f "$z"; done || true
            img=$(find . -type f \( -iname '*.bin' -o -iname '*.iso' -o -iname '*.img' \) -printf '%s %p\n' | sort -rn | head -n1 | cut -d' ' -f2-)
            [ -n "$img" ] || { echo "::error::в загруженном файле нет .bin/.iso/.img"; ls -la; exit 1; }
            echo "image: $img"
            cd ..
            python3 work/tools/extract_exe.py "dl/$img" work/SCUS_949.00
            rm -rf dl
          else
            f=$(find . -path ./work -prune -o -type f -iname 'SCUS_949.00' -print | head -n1)
            [ -n "$f" ] || { echo "::error::Укажи gdrive_id при запуске или положи SCUS_949.00 в репозиторий"; exit 1; }
            echo "exe: $f"; cp "$f" work/SCUS_949.00
          fi
      - name: Self-test (recompiler + exe extractor)
        run: cd work && python3 tests/test_recomp.py && python3 tests/test_extract.py
      - name: Recompile PS1 exe to C
        run: cd work && python3 tools/recomp.py --exe SCUS_949.00 --config tools/crash.json --out psp/src/gen
      - name: Host compile check
        run: |
          cd work/psp/src
          gcc -fsyntax-only -w -I. -Igen mem.c gte.c gpu.c spu.c cd.c card.c bios.c sdk.c cpu.c gen/recomp_000.c gen/recomp_tables.c
      - run: rm -f work/SCUS_949.00 && tar czf tree.tgz -C work .
      - uses: actions/upload-artifact@v4
        with:
          name: tree
          path: tree.tgz
          retention-days: 1

  build-psp:
    needs: recompile
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tree
      - name: Unpack
        run: mkdir work && tar xzf tree.tgz -C work
      - name: Build EBOOT.PBP (GPU renderer)
        run: |
          cd work/psp
          make -j$(nproc)
          mkdir -p ../../dist/CrashBandicoot ../../dist/CrashBandicoot-SOFT
          cp EBOOT.PBP ../../dist/CrashBandicoot/
      - name: Build EBOOT.PBP (software renderer fallback)
        run: |
          cd work/psp
          make clean
          make -j$(nproc) SOFT=1
          cp EBOOT.PBP ../../dist/CrashBandicoot-SOFT/
      - uses: actions/upload-artifact@v4
        with:
          name: CrashBandicoot-PSP
          path: dist
