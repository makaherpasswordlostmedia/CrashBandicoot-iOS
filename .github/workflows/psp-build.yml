# Один файл — вся сборка. Положи в .github/workflows/psp-build.yml ПРИВАТНОГО репозитория.
# Откуда берётся exe (SCUS_949.00):
#   1) Actions -> PSP build -> Run workflow -> поле gdrive_id (ID или ссылка Google Drive на образ диска:
#      .bin / .iso / .img или .zip / .7z с ними; доступ «у кого есть ссылка»). Из образа вытаскивается только exe.
#   2) либо положи SCUS_949.00 в репозиторий (любая папка) и сделай push.
# Все исходники (рантайм, рекомпилятор, тесты) вшиты ниже как base64 tar.gz.
name: PSP build

on:
  push:
  workflow_dispatch:
    inputs:
      gdrive_id:
        description: "Google Drive: ID файла или ссылка на образ диска Crash Bandicoot (.bin/.iso/.img/.zip/.7z)"
        required: false
        default: ""

jobs:
  recompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack embedded sources
        run: |
          mkdir -p work
