name: Build Crash Bandicoot (pick target)

# GitHub -> Actions -> "Build Crash Bandicoot (pick target)" -> Run workflow
# -> choose "target" from the dropdown.
#
# This file MUST live at <repo root>/.github/workflows/ on the DEFAULT branch,
# otherwise the "Run workflow" button does not appear.
#
# Disc IDs (only the two iOS targets need them; the disc is used ONLY to
# recompile the game executable, the .ipa/.deb contains no game data):
# fill the two fields, or save repo secrets DRIVE_CUE_ID / DRIVE_BIN_ID once
# and leave the fields empty.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        required: true
        type: choice
        default: ios-armv7-native
        options:
          - ios-armv7-native      # 32-bit iOS 7.0-9.3.5 (any armv7 device), C + Theos (.ipa/.deb)
          - ios-arm64-trollstore  # 64-bit iOS, .NET AOT, TrollStore (.ipa) [experimental]
          - android-apk           # AndroidRuntimeHost (.apk), no disc needed
          - smoke-tests-only      # x86_64 runtime tests, no disc needed
      cue_file_id:
        description: "Drive file ID of your .cue (iOS targets). Empty = secret DRIVE_CUE_ID"
        required: false
        default: ""
        type: string
      bin_file_id:
        description: "Drive file ID of your .bin (iOS targets). Empty = secret DRIVE_BIN_ID"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- smoke
  desktop-smoke:
    name: Runtime smoke tests (x86_64)
    if: inputs.target == 'ios-armv7-native' || inputs.target == 'smoke-tests-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        working-directory: CrashBandicoot.Native
        run: |
          gcc -std=gnu11 -O1 -g -Wall -Wextra -Wno-unused-parameter -Wno-misleading-indentation \
              -Wno-format-truncation -Wno-tautological-compare -Isrc -Itests \
              -o /tmp/smoke src/*.c tests/host_stub.c tests/test_main.c -lpthread
          /tmp/smoke

  # ---- iOS 32-bit (armv7)
  build-ios-armv7:
    name: iOS armv7 32-bit (Theos, iOS 7.0-9.3.5)
    if: inputs.target == 'ios-armv7-native'
    needs: desktop-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl curl ca-certificates zip unzip xz-utils bzip2 git fakeroot make python3 python3-pip python3-venv

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch disc image (yours, from Google Drive)
        env:
          CUE_FILE_ID: ${{ inputs.cue_file_id || secrets.DRIVE_CUE_ID }}
          BIN_FILE_ID: ${{ inputs.bin_file_id || secrets.DRIVE_BIN_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CUE_FILE_ID:-}" ] || [ -z "${BIN_FILE_ID:-}" ]; then
            echo "::error::Disc IDs missing. Fill cue_file_id + bin_file_id, or set secrets DRIVE_CUE_ID / DRIVE_BIN_ID."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/disc"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q gdown
          GDOWN="$RUNNER_TEMP/venv/bin/gdown"
          "$GDOWN" "$CUE_FILE_ID" -O "$RUNNER_TEMP/disc/game.cue"
          "$GDOWN" "$BIN_FILE_ID" -O "$RUNNER_TEMP/disc/game.bin"
          sed -i -E 's/^FILE "[^"]+"/FILE "game.bin"/' "$RUNNER_TEMP/disc/game.cue"
          grep -q TRACK "$RUNNER_TEMP/disc/game.cue" || { echo "::error::game.cue has no TRACK line (Drive sharing must be 'Anyone with the link')"; cat "$RUNNER_TEMP/disc/game.cue"; exit 1; }
          ls -la "$RUNNER_TEMP/disc"

      - name: Recompile (ELF -> C# -> C)
        run: |
          set -euo pipefail
          chmod +x ./scripts/prerecompile_native.sh
          ./scripts/prerecompile_native.sh "$RUNNER_TEMP/disc/game.cue" 2>&1 | tee build-recomp.log

      - name: Host compile check of generated C (gcc, syntax only)
        working-directory: CrashBandicoot.Native
        run: |
          for f in gen/*.c; do gcc -std=gnu11 -fsyntax-only -Isrc -Igen -Wno-unused-label "$f" || exit 1; done

      - name: Install Theos + iOS toolchain
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" -o /tmp/ios-toolchain.tar.xz
          tar -xf /tmp/ios-toolchain.tar.xz -C "$THEOS/toolchain"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iPhoneOS 9.3 SDK
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/iphoneos9.3.sdk.tbz2 "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/iphoneos9.3.sdk.tbz2 -C "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            if [ -f "$fw/module.map" ]; then mkdir -p "$fw/Modules"; mv "$fw/module.map" "$fw/Modules/module.modulemap"; fi
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do mv "$m" "$(dirname "$m")/module.modulemap"; done

      - name: Build .deb / .app with Theos
        working-directory: CrashBandicoot.Native
        env:
          THEOS: ${{ github.workspace }}/theos
          FINALPACKAGE: "1"
        run: |
          set -euo pipefail
          make -f Makefile clean
          make -f Makefile package FINALPACKAGE=1 V=1 2>&1 | tee ../build-theos.log
          ls -la packages

      - name: Verify Mach-O
        working-directory: CrashBandicoot.Native
        run: |
          BIN="$(find .theos -type f -name CrashBandicootARMv7 | head -n1)"
          file "$BIN" || true
          TOOLBIN="$THEOS/toolchain/linux/iphone/bin"
          OTOOL="$(ls "$TOOLBIN"/*otool* 2>/dev/null | head -n1)"
          [ -n "$OTOOL" ] && "$OTOOL" -hv -l "$BIN" | grep -E "cputype|ARM|LC_VERSION_MIN|version" | head -10 || true

      - name: Pack .ipa
        working-directory: CrashBandicoot.Native
        run: |
          set -euo pipefail
          APP="$(find .theos -type d -name CrashBandicootARMv7.app | head -n1)"
          [ -n "$APP" ] || { echo "::error::CrashBandicootARMv7.app not found in .theos"; exit 1; }
          rm -rf ipa && mkdir -p ipa/Payload packages
          cp -a "$APP" ipa/Payload/
          (cd ipa && zip -rq "../packages/CrashBandicoot-armv7-$(git rev-parse --short HEAD).ipa" Payload)
          ls -la packages

      - uses: actions/upload-artifact@v4
        with:
          name: CrashBandicoot-armv7-iOS9
          path: |
            CrashBandicoot.Native/packages/*.ipa
            CrashBandicoot.Native/packages/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-armv7
          path: |
            build-recomp.log
            build-theos.log
          if-no-files-found: ignore

  # ---- iOS 64-bit (.NET AOT)
  build-ios-arm64:
    name: iOS arm64 64-bit (.NET AOT, TrollStore) [experimental]
    if: inputs.target == 'ios-arm64-trollstore'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Fetch disc image (yours, from Google Drive)
        env:
          CUE_FILE_ID: ${{ inputs.cue_file_id || secrets.DRIVE_CUE_ID }}
          BIN_FILE_ID: ${{ inputs.bin_file_id || secrets.DRIVE_BIN_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CUE_FILE_ID:-}" ] || [ -z "${BIN_FILE_ID:-}" ]; then
            echo "::error::Disc IDs missing. Fill cue_file_id + bin_file_id, or set secrets DRIVE_CUE_ID / DRIVE_BIN_ID."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/disc"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q gdown
          GDOWN="$RUNNER_TEMP/venv/bin/gdown"
          "$GDOWN" "$CUE_FILE_ID" -O "$RUNNER_TEMP/disc/game.cue"
          "$GDOWN" "$BIN_FILE_ID" -O "$RUNNER_TEMP/disc/game.bin"
          sed -i '' -E 's/^FILE "[^"]+"/FILE "game.bin"/' "$RUNNER_TEMP/disc/game.cue"
          grep -q TRACK "$RUNNER_TEMP/disc/game.cue" || { echo "::error::game.cue has no TRACK line (Drive sharing must be 'Anyone with the link')"; cat "$RUNNER_TEMP/disc/game.cue"; exit 1; }
          ls -la "$RUNNER_TEMP/disc"

      - name: Recompile (ELF -> C#), uses .NET 10
        run: |
          set -euo pipefail
          chmod +x ./scripts/prerecompile.sh
          ./scripts/prerecompile.sh "$RUNNER_TEMP/disc/game.cue" 2>&1 | tee build-recomp.log

      - name: Install iOS workload
        run: |
          set -euo pipefail
          dotnet --list-sdks
          dotnet workload install ios

      - name: Build .ipa
        run: |
          set -euo pipefail
          dotnet build CrashBandicoot.IosHost -c Release -r ios-arm64 -p:BuildIpa=true 2>&1 | tee build-ios.log

      - name: Collect .ipa
        run: |
          set -euo pipefail
          mkdir -p out
          find CrashBandicoot.IosHost/bin -name '*.ipa' -exec cp -v {} out/ \;
          ls -la out
          [ -n "$(ls out/*.ipa 2>/dev/null)" ] || { echo "::error::no .ipa produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: CrashBandicoot-iOS-arm64-ipa
          path: out/*.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-ios-arm64
          path: |
            build-recomp.log
            build-ios.log
          if-no-files-found: ignore

  # ------------------------------------------------------------- Android
  build-android:
    name: Android APK
    if: inputs.target == 'android-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        run: |
          set -euo pipefail
          dotnet workload install android

      - name: Create throwaway signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci.keystore" -alias ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cipass123 -keypass cipass123 -dname "CN=CI Build"

      - name: Publish APK
        run: |
          set -euo pipefail
          dotnet publish AndroidRuntimeHost/AndroidRuntimeHost.csproj -c Release -f net10.0-android \
            -p:AndroidSdkDirectory="${ANDROID_HOME:-$ANDROID_SDK_ROOT}" \
            -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:AndroidPackageFormat=apk \
            -p:AndroidEnableAssemblyCompression=true \
            -p:AndroidEnableMarshalMethods=false \
            -p:RunAOTCompilation=false \
            -p:AndroidEnableProfiledAot=false \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/ci.keystore" \
            -p:AndroidSigningKeyAlias=ci \
            -p:AndroidSigningStorePass=cipass123 \
            -p:AndroidSigningKeyPass=cipass123 \
            -p:DebugType=None -p:DebugSymbols=false \
            -o out 2>&1 | tee build-android.log
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: CrashBandicoot-android-apk
          path: out/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-android
          path: build-android.log
          if-no-files-found: ignore
